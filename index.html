<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HailandX - Accueil Chaleureux</title>
    
    <link rel="stylesheet" href="index.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

    <div id="ptr-indicator" aria-hidden="true"><span class="ptr-icon">↻</span></div>

    <button class="menu-trigger" onclick="openNav()" aria-label="Ouvrir le menu">☰ Menu</button>

    <nav id="sideNav" class="sidenav">
      <a href="javascript:void(0)" class="closebtn" onclick="closeNav()" aria-label="Fermer">&times;</a>
      
      <div class="menu-header">
        <p id="display-role">Chargement...</p>
      </div>

      <div id="special-options"></div>
    </nav>

    <main id="main-content">
        </main>

    <script src="config.js"></script>
    <script src="calcul.js"></script>

    <script src="auth.js"></script>
    <script src="session.js"></script>
    <script src="shop.js"></script>
    <script src="buy.js"></script>
    <script src="livreur.js"></script>
    <script src="menu.js"></script>

    <script src="index.js"></script>

    <script>
        // Utilisation de DOMContentLoaded plutôt que window.onload pour plus de rapidité
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof afficherAccueil === "function") {
                afficherAccueil();
            }
        });
    </script>
        
</body>
</html>
