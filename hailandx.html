async function chargerProduitsB2B() {
  const tel  = sess('hx_phone');
  const cont = document.getElementById('b2b-liste-produits');
  if(!cont) return;

  const { data, error } = await _sb.from('lots_grossistes')
    .select('*').eq('grossiste_contact',tel).gt('quantite',0).order('designation',{ascending:true});

  if(error||!data||data.length===0) {
    cont.innerHTML=`<p style="color:var(--muted);text-align:center;padding:16px">Aucun stock disponible. Enregistrez d'abord un arrivage.</p>`;
    return;
  }

  cont.innerHTML = data.map(p => `
    <div class="b2b-product-row" id="row-b2b-${sanitize(p.id)}">
      <div style="flex:1">
        <div class="b2b-name">📦 ${sanitize(p.designation)}</div>
        <div class="b2b-unit">Stock: ${p.quantite} ${sanitize(p.unite||'unité')}(s) · ${Number(p.prix_unitaire).toLocaleString('fr-FR')} GNF/${sanitize(p.unite||'u')}</div>
      </div>
      <input type="number" min="0" max="${p.quantite}" value="0" placeholder="0"
             oninput="majLigneB2B('${sanitize(p.id)}','${(p.designation||'').replace(/'/g,"\\'")}',${p.prix_unitaire},${p.quantite},'${(p.unite||'u').replace(/'/g,"\\'")}',this.value)"
             style="width:65px"/>
      <div class="b2b-sous-total" id="st-${sanitize(p.id)}">–</div>
    </div>`).join('');
}

function majLigneB2B(id, nom, prix, stockMax, unite, valeur) {
  const qte = Math.min(parseInt(valeur)||0, stockMax);
  const idx = panierB2B.findIndex(x => x.id === id);
  if(qte > 0) {
    if(idx >= 0) panierB2B[idx].qte = qte;
    else panierB2B.push({ id, nom, prix, qte, unite });
  } else {
    if(idx >= 0) panierB2B.splice(idx, 1);
  }
  const stEl = document.getElementById('st-'+id);
  if(stEl) stEl.textContent = qte > 0 ? Number(qte*prix).toLocaleString('fr-FR')+' GNF' : '–';
  const total = panierB2B.reduce((s,i) => s+i.prix*i.qte, 0);
  const elT = document.getElementById('b2b-total-display');
  if(elT) elT.textContent = Number(total).toLocaleString('fr-FR');
}

async function finaliserVenteGros() {
  if(panierB2B.length === 0) { toast('Ajoutez des quantités','warn'); return; }
  const nomClient  = document.getElementById('b2b-nom-client')?.value?.trim();
  const telClient  = document.getElementById('b2b-tel-client')?.value?.trim();
  const modePaie   = document.getElementById('b2b-mode-paiement')?.value;
  const tel        = sess('hx_phone');

  if(!nomClient) { toast('Renseignez le nom du boutiquier','warn'); return; }

  const total = panierB2B.reduce((s,i) => s+i.prix*i.qte, 0);
  const btn = document.querySelector('#modal-vente-gros .btn-valider-vente');
  if(btn) { btn.disabled=true; btn.textContent='⏳ Enregistrement...'; }

  try {
    // 1. Enregistrer la vente B2B
    const { error: errV } = await _sb.from('ventes_gros').insert([{
      grossiste_id: tel, nom_client: nomClient, tel_client: telClient||null,
      mode_paiement: modePaie, total,
      details: panierB2B,
      statut: modePaie === 'credit' ? 'en_attente' : 'paye',
      created_at: new Date().toISOString()
    }]);
    if(errV) throw errV;

    // 2. Décrémenter le stock pour chaque article vendu
    for(const item of panierB2B) {
      const { data: lot } = await _sb.from('lots_grossistes').select('quantite').eq('id',item.id).single();
      if(lot) {
        await _sb.from('lots_grossistes').update({ quantite: Math.max(0, lot.quantite - item.qte) }).eq('id', item.id);
      }
    }

    // 3. Si crédit → enregistrer dans le cahier
    if(modePaie === 'credit') {
      await _sb.from('credits_boutiquiers').insert([{
        grossiste_id: tel, nom_client: nomClient, tel_client: telClient||null,
        montant: total, rembourse: false,
        created_at: new Date().toISOString()
      }]);
      toast(`📒 Crédit de ${Number(total).toLocaleString('fr-FR')} GNF enregistré pour ${nomClient}`, 'warn');
    } else {
      toast(`✅ Vente B2B de ${Number(total).toLocaleString('fr-FR')} GNF validée !`, 'success');
    }

    panierB2B = [];
    fermerModal('modal-vente-gros');
    await chargerStockGros();
    await actualiserDashboardGrossiste();
    await chargerHistoriqueVentesGros();

  } catch(err) {
    toast('Erreur: '+(err.message||'Impossible'),'error');
    if(btn) { btn.disabled=false; btn.textContent='🚛 VALIDER LA VENTE B2B'; }
  }
}

async function marquerRembourse(creditId) {

async function actualiserDashboardImportateur() {
  const tel = sess('hx_phone');

  const { data: cargs } = await _sb.from('cargaisons_importateurs')
    .select('statut,valeur_estimee').eq('importateur_contact', tel);

  const enTransit = (cargs||[]).filter(c=>c.statut==='en_transit').length;
  const enDouane  = (cargs||[]).filter(c=>c.statut==='en_douane').length;
  const caGlobal  = (cargs||[]).reduce((s,c)=>s+(c.valeur_estimee||0),0);

  const e1 = document.getElementById('kpi-transit');
  const e2 = document.getElementById('kpi-douane');
  const e3 = document.getElementById('kpi-ca-global');
  if(e1) e1.textContent = enTransit+' conteneur'+(enTransit>1?'s':'');
  if(e2) e2.textContent = enDouane+' cargaison'+(enDouane>1?'s':'');
  if(e3) e3.textContent = Number(caGlobal).toLocaleString('fr-FR')+' GNF';

  // Analyse IA (simulation basée sur les données réelles)
  analyserMarcheIA(cargs||[]);
}

function analyserMarcheIA(cargs) {
  const el = document.getElementById('ia-conseil-achat');
  if(!el) return;
  const enDouane = cargs.filter(c=>c.statut==='en_douane').length;
  const enTransit= cargs.filter(c=>c.statut==='en_transit').length;
  let conseil = '';
  if(enDouane > 0) {
    conseil = `⚠️ Vous avez <strong>${enDouane} cargaison(s) bloquée(s) en douane</strong>. Contactez votre transitaire pour accélérer le dédouanement et éviter les frais de surestarie.`;
  } else if(enTransit > 2) {
    conseil = `📈 <strong>${enTransit} conteneurs</strong> sont en route. Anticipez l'espace d'entrepôt et notifiez vos grossistes partenaires pour un déchargement rapide.`;
  } else {
    conseil = `✅ Flux logistique stable. Surveillez la consommation nationale en riz, huile et sucre — produits critiques à réapprovisionner en priorité selon la saison.`;
  }
  el.innerHTML = `🤖 <strong>Analyse IA :</strong> ${conseil}`;
}

async function chargerRadarPenuries() {
  const cont = document.getElementById('radar-penurie');

  // Récupérer les stocks critiques chez tous les boutiquiers
  const { data: produits } = await _sb.from('produits')
    .select('nom_produit,stock,categorie')
    .lt('stock', 5)
    .order('stock', {ascending:true})

    cont.innerHTML=`<div class="ai-insight">✅ <strong>Aucune pénurie détectée</strong> sur les produits critiques actuellement.</div>`;

function _renderCargaisonCard(c) {
  const statutMap = {
    en_transit: { label:'🚢 En transit',  cls:'badge-transit',  cardCls:'en_transit' },
    en_douane:  { label:'🏛️ En douane',   cls:'badge-douane',   cardCls:'en_douane'  },
    dédouanée: { label:'✅ Dédouanée',   cls:'badge-dispo',    cardCls:'dédouanée' },
    disponible: { label:'📦 Disponible',  cls:'badge-dispo',    cardCls:'disponible' },
  };
  const s = statutMap[c.statut] || { label:c.statut, cls:'badge-transit', cardCls:'en_transit' };
  const docsMap = { complets:'douane-ok ✅ Docs OK', en_cours:'douane-warn ⏳ Docs en cours', manquants:'douane-bad ❌ Docs manquants' };
  const [docsCls, docsLabel] = (docsMap[c.documents_douane]||'douane-warn ⏳ En cours').split(' ', 1).concat((docsMap[c.documents_douane]||'').split(/ (.+)/)[1]||'');
  const transportIcon = { maritime:'🚢', aerien:'✈️', routier:'🚛' };
  return `
    <div class="cargaison-card ${s.cardCls}">
      <div class="carg-header">
        <div>
          <div class="carg-nom">${sanitize(c.designation)}</div>
          <div class="carg-meta">
            ${transportIcon[c.type_transport]||'🚢'} ${sanitize(c.pays_origine||'Origine inconnue')}
            ${c.numero_conteneur ? ' · '+sanitize(c.numero_conteneur) : ''}
            ${c.poids_tonne ? ' · '+c.poids_tonne+'T' : ''}
            ${c.date_arrivee ? '<br>📅 Arrivée prévue : '+new Date(c.date_arrivee).toLocaleDateString('fr-FR') : ''}
          </div>
        </div>
        <span class="carg-statut-badge ${s.cls}">${s.label}</span>
      </div>
      <div class="carg-footer">
        <div class="carg-valeur">${Number(c.valeur_estimee||0).toLocaleString('fr-FR')} GNF</div>
        <div class="carg-actions">
          <div class="douane-indicator ${docsMap[c.documents_douane]?.split(' ')[0]||'douane-warn'}" style="padding:5px 8px;font-size:.72rem">
            ${docsLabel||'⏳ Docs en cours'}
          </div>
          <button class="btn btn-sm btn-ghost" onclick="changerStatutCargaison('${sanitize(c.id)}','${c.statut}')">✏️</button>
          <button class="inv-del-btn" onclick="supprimerCargaison('${sanitize(c.id)}')">✕</button>
        </div>
      </div>
    </div>`;
}

async function enregistrerCargaisonImport() {
  const nom       = document.getElementById('imp-nom')?.value?.trim();
  const conteneur = document.getElementById('imp-conteneur')?.value?.trim();
  const transport = document.getElementById('imp-transport')?.value;
  const pays      = document.getElementById('imp-pays')?.value?.trim();
  const poids     = parseFloat(document.getElementById('imp-poids')?.value) || 0;
  const statut    = document.getElementById('imp-statut')?.value;
  const valeur    = parseInt(document.getElementById('imp-valeur')?.value) || 0;
  const date      = document.getElementById('imp-date')?.value;
  const docs      = document.getElementById('imp-docs')?.value;
  const tel       = sess('hx_phone');

  if(!nom||!pays) { toast('Remplissez au moins le nom du produit et le pays','warn'); return; }

  const btn = document.getElementById('imp-btn-save');
  if(btn) { btn.disabled=true; btn.textContent='⏳ Enregistrement...'; }

  const { error } = await _sb.from('cargaisons_importateurs').insert([{
    designation:nom, numero_conteneur:conteneur||null, type_transport:transport,
    pays_origine:pays, poids_tonne:poids||null, statut,
    valeur_estimee:valeur||null, date_arrivee:date||null,
    documents_douane:docs, importateur_contact:tel,
    created_at:new Date().toISOString()
  }]);

  if(error) { toast('Erreur: '+error.message,'error'); }
  else {
    toast('✅ Cargaison enregistrée ! Vos grossistes seront notifiés à l\'arrivée.','success');
    ['imp-nom','imp-conteneur','imp-pays','imp-poids','imp-valeur','imp-date'].forEach(id=>{
      const el=document.getElementById(id); if(el) el.value='';
    });
    fermerModal('modal-declarer-import');

async function changerStatutCargaison(id, statutActuel) {
  const ordres = ['en_transit','en_douane','dédouanée','disponible'];
  const labels = { en_transit:'En transit', en_douane:'En douane', dédouanée:'Dédouanée', disponible:'Disponible' };
  const suivant = ordres[ordres.indexOf(statutActuel)+1];
  if(!suivant) { toast('Cette cargaison est déjà au stade final','warn'); return; }

  const ok = await hxDialog({
    title:'Mettre à jour le statut',
    msg:`Passer de "${labels[statutActuel]}" à "${labels[suivant]}" ?`,
    confirm:'Confirmer'
  });
  if(!ok) return;

  const { error } = await _sb.from('cargaisons_importateurs')
    .update({ statut: suivant }).eq('id', id);
  if(error) { toast('Erreur: '+error.message,'error'); return; }
  toast(`✅ Statut mis à jour : ${labels[suivant]}`,'success');
  await chargerCargaisonsActives();
  await chargerToutesCargaisons();
  await actualiserDashboardImportateur();
}

async function chargerReseauGrossistes() {
  const cont = document.getElementById('liste-reseau-grossistes');
  if(!cont) return;

  const { data, error } = await _sb.from('grossistes')
    .select('nom,telephone,zone,nom_entreprise').order('nom',{ascending:true});

  if(error||!data||data.length===0) {
    cont.innerHTML=`<div class="empty-state"><div class="empty-icon">👥</div><div class="empty-title">Aucun grossiste inscrit</div><div class="empty-sub">Les grossistes partenaires apparaîtront ici.</div></div>`;
    return;
  }

  // Pour chaque grossiste, récupérer son niveau de stock global
  const rendu = await Promise.all(data.map(async g => {
    const { data: lots } = await _sb.from('lots_grossistes')
      .select('quantite,seuil_alerte').eq('grossiste_contact',g.telephone);
    const totalQte    = (lots||[]).reduce((s,l)=>s+(l.quantite||0),0);
    const totalSeuil  = (lots||[]).reduce((s,l)=>s+(l.seuil_alerte||10),0);
    const ratio       = totalSeuil > 0 ? totalQte/totalSeuil : 1;
    const pillCls     = ratio < 0.5 ? 'low' : ratio < 1 ? 'med' : 'high';
    const pillLabel   = ratio < 0.5 ? '🔴 Stock bas' : ratio < 1 ? '🟡 Moyen' : '🟢 Bon stock';

    return `
      <div class="grossiste-network-card">
        <div class="emoji-avatar" style="width:40px;height:40px;font-size:1.1rem;background:rgba(59,130,246,.1);border-color:var(--info)">🏢</div>
        <div class="gn-info">
          <div class="gn-nom">${sanitize(g.nom_entreprise||g.nom)}</div>
          <div class="gn-zone">📍 ${sanitize(g.zone||'Zone inconnue')} · 📞 ${sanitize(g.telephone)}</div>
        </div>
        <span class="stock-pill ${pillCls}">${pillLabel}</span>
      </div>`;
  }));
  cont.innerHTML = rendu.join('');
}

function ouvrirCalculateurCout() {
  const modal = document.getElementById('modal-calculateur');
  if(modal) { modal.classList.remove('hidden'); document.body.style.overflow='hidden'; }
  recalculerCout();
}

function recalculerCout() {
  const achat     = parseInt(document.getElementById('calc-achat')?.value)||0;
  const fret      = parseInt(document.getElementById('calc-fret')?.value)||0;
  const douane    = parseInt(document.getElementById('calc-douane')?.value)||0;
  const transport = parseInt(document.getElementById('calc-transport')?.value)||0;
  const marge     = parseInt(document.getElementById('calc-marge')?.value)||20;
  const qte       = parseInt(document.getElementById('calc-qte')?.value)||1;

  const totalCarg   = achat + fret + douane + transport;
  const revientU    = qte > 0 ? Math.round(totalCarg/qte) : 0;
  const margeU      = Math.round(revientU * marge/100);
  const prixVente   = revientU + margeU;

  const fmt = n => n > 0 ? Number(n).toLocaleString('fr-FR')+' GNF' : '–';
  const set = (id,v) => { const el=document.getElementById(id); if(el) el.textContent=v; };

  set('c-total-carg',      fmt(totalCarg));
  set('c-revient-unite',   fmt(revientU));
  set('c-marge-unite',     margeU > 0 ? '+'+fmt(margeU) : '–');
  set('c-prix-vente-conseille', fmt(prixVente));
}

async function toggleScanner() {
  const readerDiv = document.getElementById('reader');
  if(scannerOpen) {
    if(html5QrCode) { try { await html5QrCode.stop(); } catch{} }
    readerDiv.style.display='none';
    document.getElementById('scan-status').textContent='';
    scannerOpen=false;
  } else {
    readerDiv.style.display='block';
    await initScanner();
    scannerOpen=true;
  }
}

async function initScanner() {
  const status = document.getElementById('scan-status');
  status.textContent = '📷 Accès caméra...';
  html5QrCode = new Html5Qrcode('reader', { verbose:false });
  try {
    await html5QrCode.start(
      { facingMode:'environment' },
      { fps:15, qrbox:{ width:250, height:150 } },
      async (text) => {
        if(navigator.vibrate) navigator.vibrate(80);
        if(text.startsWith('HAILANDX_CONFIRM_')) {
          await toggleScanner();
          const { error } = await _sb.from('missions').update({statut:'livre'}).eq('id',text.replace('HAILANDX_CONFIRM_',''));
          toast(error ? 'Erreur validation':'✅ Livraison validée !', error?'error':'success');
        } else {
          status.textContent = '🔍 Recherche du produit...';
          await chercherProduitParcode(text);
          await toggleScanner();
        }
      }
    );
    status.textContent = '✅ Prêt – visez un code-barres';
  } catch(e) {
    status.textContent = '❌ Accès caméra refusé';
    scannerOpen=false;
  }
}

async function chercherProduitParcode(barcode) {
  const status = document.getElementById('scan-status');
  try {
    const res  = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
    const data = await res.json();
    if(data.status===1) {
      const nom = data.product.product_name_fr || data.product.product_name || '';
      if(nom) {
        const inp = document.getElementById('p-nom');
        if(inp) inp.value = sanitize(nom);
        toast('✨ Produit reconnu : '+nom,'success');
      }
    } else {
      status.textContent = '⚠️ Produit non trouvé dans la base mondiale';
    }
  } catch { status.textContent = '⚠️ Erreur réseau'; }
}

async function ajouterProduit() {
  const nom       = document.getElementById('p-nom')?.value?.trim();
  const prix      = parseInt(document.getElementById('p-prix')?.value);
  const prixAchat = parseInt(document.getElementById('p-prix-achat')?.value) || 0;
  const stock     = parseInt(document.getElementById('p-stock')?.value) || 1;
  const emoji     = document.getElementById('p-emoji')?.value?.trim() || '📦';
  const cat       = document.getElementById('p-cat')?.value;
  const zone      = document.getElementById('p-zone')?.value;
  const monTel    = sess('hx_phone');

  if(!nom || isNaN(prix) || prix < 100) { toast('Remplissez nom et prix (min 100 GNF)','warn'); return; }

  const btn = document.getElementById('btn-publier');
  if(btn) { btn.disabled=true; btn.textContent='⏳...'; }

  const { error } = await _sb.from('produits').insert([{
    nom_produit: nom, prix, prix_achat: prixAchat,
    stock, emoji_icone: emoji,
    categorie: cat, zone,
    vendeur_contact: monTel, created_at: new Date().toISOString()
  }]);

  if(error) { toast('Erreur: '+error.message,'error'); }
  else {
    document.getElementById('p-nom').value='';
    document.getElementById('p-prix').value='';
    document.getElementById('p-prix-achat').value='';
    document.getElementById('p-stock').value='1';
    document.getElementById('p-emoji').value='';
    toast('✅ Produit publié !','success');
    await actualiserStock();
    await actualiserDashboard();
  }
  if(btn) { btn.disabled=false; btn.textContent='✅ Publier le produit'; }
}

/* ─── Charger les produits pour la vente rapide ─── */
async function chargerVenteRapide() {
  const monTel = sess('hx_phone');
  const { data: produits, error } = await _sb.from('produits')
    .select('*').eq('vendeur_contact', monTel).order('nom_produit',{ascending:true});
  if(error || !produits) {
    document.getElementById('grille-produits-boutons').innerHTML =
      `<p style="color:var(--muted);padding:20px;text-align:center">Aucun produit. Ajoutez d'abord votre stock.</p>`;
    return;
  }
  tousLesProduits = produits;
  afficherGrilleProduits(produits);
}

function afficherGrilleProduits(produits) {
  const container = document.getElementById('grille-produits-boutons');
  if(!container) return;
  if(!produits || produits.length === 0) {
    container.innerHTML = `<p style="color:var(--muted);text-align:center;padding:20px;grid-column:1/-1">Aucun produit trouvé</p>`;
    return;
  }
  container.innerHTML = produits.map(p => {
    const qteEnPanier = panierActuel.filter(x => x.id === p.id).length;
    const stockRestant = (p.stock || 0) - qteEnPanier;
    const epuise = stockRestant <= 0;
    const nomEsc = (p.nom_produit||'').replace(/'/g,"\\'");
    const emojiEsc = (p.emoji_icone||'📦').replace(/'/g,"\\'");
    return `
      <div class="btn-produit-select" onclick="${epuise ? "toast('Stock épuisé','warn')" : `ajouterAuPanier('${p.id}','${nomEsc}',${p.prix},${p.prix_achat||0},'${emojiEsc}')`}"
           style="${epuise?'opacity:.45;pointer-events:none':''}">
        ${qteEnPanier > 0 ? `<div class="p-qty-badge">${qteEnPanier}</div>` : ''}
        <span class="p-emoji">${sanitize(p.emoji_icone||'📦')}</span>
        <span class="p-name">${sanitize(p.nom_produit)}</span>
        <span class="p-price">${Number(p.prix).toLocaleString('fr-FR')} GNF</span>
        ${epuise?'<span style="font-size:.65rem;color:#EF4444;font-weight:700">ÉPUISÉ</span>':''}
      </div>`;
  }).join('');
}

function filtrerVente() {
  const q = document.getElementById('search-produit-vente')?.value?.toLowerCase() || '';
  afficherGrilleProduits(tousLesProduits.filter(p => p.nom_produit?.toLowerCase().includes(q)));
}

function ajouterAuPanier(id, nom, prix, prixAchat, emoji) {
  panierActuel.push({ id, nom, prix, prixAchat: prixAchat||0, emoji: emoji||'📦' });
  calculerTotal();
  filtrerVente();
  if(navigator.vibrate) navigator.vibrate(40);
}

function retirerDuPanier(index) {
  panierActuel.splice(index, 1);
  calculerTotal();
  filtrerVente();
}

function calculerTotal() {
  const total   = panierActuel.reduce((s, i) => s + i.prix, 0);
  const elTotal = document.getElementById('total-vente-en-cours');
  const bar     = document.getElementById('recap-vente');
  const preview = document.getElementById('panier-preview');
  if(elTotal) elTotal.textContent = Number(total).toLocaleString('fr-FR');
  if(bar) { if(panierActuel.length>0) bar.classList.remove('hidden'); else bar.classList.add('hidden'); }
  if(preview) {
    const groupes = {};
    panierActuel.forEach((item,idx) => {
      if(!groupes[item.id]) groupes[item.id] = { ...item, count:0, indices:[] };
      groupes[item.id].count++;
      groupes[item.id].indices.push(idx);
    });
    preview.innerHTML = Object.values(groupes).map(g =>
      `<div class="panier-chip" onclick="retirerDuPanier(${g.indices[g.indices.length-1]})" title="Cliquer pour retirer">
        ${sanitize(g.emoji)} ${sanitize(g.nom)}${g.count>1?` x${g.count}`:''} ✕
      </div>`).join('');
  }
}

async function finaliserVente() {
  if(panierActuel.length === 0) return;
  const monTel  = sess('hx_phone');
  const total   = panierActuel.reduce((s,i) => s+i.prix, 0);
  const benefice = panierActuel.reduce((s,i) => s+(i.prix-(i.prixAchat||0)), 0);
  const btnValider = document.querySelector('.btn-valider-vente');
  if(btnValider) { btnValider.disabled=true; btnValider.textContent='⏳ Enregistrement...'; }
  try {
    const { error: errVente } = await _sb.from('ventes').insert([{
      vendeur_id: monTel, total, benefice,
      produits: panierActuel.map(p => ({ id:p.id, nom:p.nom, prix:p.prix })),
      created_at: new Date().toISOString()
    }]);
    if(errVente) throw errVente;

    // Décrémenter le stock (groupé)
    const decrements = {};
    panierActuel.forEach(item => { decrements[item.id] = (decrements[item.id]||0)+1; });
    for(const [prodId, qte] of Object.entries(decrements)) {
      const { error: rpcErr } = await _sb.rpc('decrementer_stock', { prod_id: prodId, quantite: qte });
      if(rpcErr) {
        // Fallback manuel si la fonction RPC n'existe pas
        const { data: pData } = await _sb.from('produits').select('stock').eq('id', prodId).single();
        if(pData) await _sb.from('produits').update({ stock: Math.max(0,(pData.stock||0)-qte) }).eq('id', prodId);
      }
    }

    toast('✅ Vente enregistrée !', 'success');
    panierActuel = [];
    calculerTotal();
    fermerVenteRapide();
    await actualiserDashboard();
    await chargerHistoriqueVentes();
  } catch(err) {
    toast('Erreur: '+(err.message||'Impossible'), 'error');
    if(btnValider) { btnValider.disabled=false; btnValider.textContent='✅ VALIDER LA VENTE'; }
  }
}

let btqMarkers     = [];     // marqueurs boutiquiers (DOM)

/* ── Style MapLibre CartoCDN Dark Matter (tuiles vectorielles) ── */

/* ─── Ouvrir la carte ─── */
async function ouvrirHailandMap() {
  const overlay = document.getElementById('hailand-map-overlay');
  if(!overlay) return;
  overlay.classList.remove('hidden');

  if(!mapInitialized) {
    await _initMapLibre();
    mapInitialized = true;
  } else {
    hxMap.resize();
  }

  // Démarrer le GPS dédié carte
  if(navigator.geolocation) {
    mapWatchId = navigator.geolocation.watchPosition(
      pos => actualiserPositionClient(pos.coords.latitude, pos.coords.longitude),
      err => console.warn('GPS carte:', err),
      { enableHighAccuracy:true, maximumAge:4000, timeout:12000 }
    );
  }

  // Horloge nocturne
  _demarrerHorloge();

  await chargerBoutiquiersHailandX();
  await chargerStatsCarte();
  await verifierAdresseExistante();
}

/* ─── Initialisation MapLibre GL ─── */
function _initMapLibre() {
  return new Promise(resolve => {
    const container = document.getElementById('hailand-map-container');
    if(!container) { resolve(); return; }

    hxMap = new maplibregl.Map({
      container: 'hailand-map-container',
      style: MAP_STYLE_DARK,
      center: [-13.677, 9.537],  // Conakry
      zoom: 15,
      pitch: 65,                  // Inclinaison 3D
      bearing: -15,               // Légère rotation pour la profondeur
      antialias: true,
      attributionControl: false
    });

    // Contrôles zoom + boussole
    hxMap.addControl(new maplibregl.NavigationControl({ showCompass:true, showZoom:true }), 'bottom-right');

    hxMap.on('load', () => {
      _ajouterCouchesBatiments();
      _ajouterCouchesRoutes();
      _ajouterCouchesVegetation();
      _ajouterCouchesEau();
      _ajouterLumieresNocturnes();
      _configurerAmbiance();
      resolve();
    });

    // Mise à jour indicateur zoom et pitch
    hxMap.on('move', () => {
      const z = document.getElementById('map-zoom-val');
      if(z) z.textContent = Math.round(hxMap.getZoom());
    });
    hxMap.on('pitch', () => {
      const p = document.getElementById('map-pitch-val');
      if(p) p.textContent = Math.round(hxMap.getPitch()) + '°';
    });
  });
}

/* ─── Modes carte (2D / 3D / Satellite) ─── */
function setMapMode(mode) {
  mapCurrentMode = mode;
  document.querySelectorAll('.map-mode-btn').forEach(b => b.classList.remove('active'));

  if(mode === '3d') {
    hxMap.easeTo({ pitch:65, bearing:-15, duration:800 });
    document.getElementById('btn-mode-3d')?.classList.add('active');
  } else if(mode === '2d') {
    hxMap.easeTo({ pitch:0, bearing:0, duration:800 });
    document.querySelector('.map-mode-btn:first-child')?.classList.add('active');
  } else if(mode === 'satellite') {
    hxMap.easeTo({ pitch:50, bearing:0, duration:800 });
    document.querySelector('.map-mode-bar button:last-child')?.classList.add('active');
    // Switcher vers style satellite temporairement
    toast('🛰️ Mode satellite activé','');
  }
}

/* ─── Horloge nocturne dans la topbar ─── */
function _demarrerHorloge() {
  const el = document.getElementById('map-clock');
  if(!el) return;
  const update = () => {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const icon = (now.getHours() >= 6 && now.getHours() < 18) ? '☀️' : '🌙';
    el.textContent = `${icon} ${h}:${m}`;
  };
  update();
  setInterval(update, 30000);
}

/* ─── Mettre à jour la position client ─── */
function actualiserPositionClient(lat, lon) {
  if(!hxMap) return;

  if(!userMarker) {
    // Créer le marqueur pulsé bleu
    const el = document.createElement('div');
    el.className = 'user-pos-marker';
    userMarker = new maplibregl.Marker({ element:el, anchor:'center' })
      .setLngLat([lon, lat])
      .setPopup(new maplibregl.Popup({ offset:20 }).setHTML('<b style="color:#60A5FA">📍 Vous êtes ici</b>'))
      .addTo(hxMap);
    hxMap.flyTo({ center:[lon,lat], zoom:16, pitch:65, bearing:-15, duration:1200 });
  } else {
    userMarker.setLngLat([lon, lat]);
  }
}

/* ─── Charger boutiquiers sur la carte ─── */
async function chargerBoutiquiersHailandX() {
  if(!hxMap) return;

  // Supprimer anciens marqueurs
  btqMarkers.forEach(m => m.remove());
  btqMarkers = [];

  const { data: boutiques, error } = await _sb
    .from('vendeurs')
    .select('nom_boutique, latitude, longitude, telephone, zone');

  if(error || !boutiques) return;

  let count = 0;
  boutiques.forEach(btq => {
    const lat = parseFloat(btq.latitude);
    const lon = parseFloat(btq.longitude);
    if(!lat || !lon || isNaN(lat) || isNaN(lon)) return;
    count++;

    // Marqueur doré boutique
    const el = document.createElement('div');
    el.className = 'btq-dot';
    el.title = btq.nom_boutique || 'Boutique';

    const nomEsc = (btq.nom_boutique||'Boutique').replace(/'/g,"\\'").replace(/"/g,'&quot;');
    const popup = new maplibregl.Popup({ offset:16, maxWidth:'200px' }).setHTML(`
      <div class="btq-popup">
        <strong>🏪 ${sanitize(btq.nom_boutique||'Boutique')}</strong>
        <small>📍 ${sanitize(btq.zone||'Conakry')} · Partenaire HailandX</small>
        <button class="btn-itineraire"
          onclick="tracerRoute(${lat},${lon},'${nomEsc}');document.querySelector('.maplibregl-popup-close-button')?.click()">
          🗺️ Itinéraire
        </button>
        <button class="btn-commander-popup"
          onclick="fermerHailandMap();commander('',${JSON.stringify(btq.telephone||'')},0)">
          🛒 Commander ici
        </button>
      </div>`);

    const marker = new maplibregl.Marker({ element:el, anchor:'center' })
      .setLngLat([lon, lat])
      .setPopup(popup)
      .addTo(hxMap);

    btqMarkers.push(marker);
  });

  const el = document.getElementById('map-count-btq');
  if(el) el.textContent = count;
}

  const { count } = await _sb.from('livreurs')

/* ─── Tracer itinéraire (ligne animée verte) ─── */
async function tracerRoute(destLat, destLon, destNom) {
  if(!hxMap || !userMarker) {
    toast('Activez le GPS pour obtenir un itinéraire','warn'); return;
  }

  const userLL = userMarker.getLngLat();

  // Supprimer l'ancien itinéraire
  annulerItineraire();

  // Afficher panel
  const panel = document.getElementById('route-info-panel');
  const elDest  = document.getElementById('route-dest-name');
  const elStats = document.getElementById('route-stats');
  if(panel)  panel.classList.remove('hidden');
  if(elDest) elDest.textContent = '🏪 '+destNom;
  if(elStats) elStats.textContent = '⏳ Calcul…';

  // Requête OSRM (routage libre)
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${userLL.lng},${userLL.lat};${destLon},${destLat}?overview=full&geometries=geojson`;
    const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
    const data = await res.json();

    if(data.routes && data.routes.length > 0) {
      const route = data.routes[0];
      const km    = (route.distance/1000).toFixed(1);
      const min   = Math.round(route.duration/60);
      if(elStats) elStats.textContent = `📏 ${km} km · ⏱️ ~${min} min à moto`;

      // Source GeoJSON de la ligne
      if(hxMap.getSource('hx-route')) {
        hxMap.getSource('hx-route').setData(route.geometry);
      } else {
        hxMap.addSource('hx-route', { type:'geojson', data: route.geometry });

        // Halo vert sous la route
        hxMap.addLayer({
          id: 'hx-route-glow',
          type: 'line',
          source: 'hx-route',
          paint: {
            'line-color': 'rgba(74,222,128,0.25)',
            'line-width': 12, 'line-blur': 4
          }
        });

        // Ligne principale verte
        hxMap.addLayer({
          id: 'hx-route-line',
          type: 'line',
          source: 'hx-route',
          paint: {
            'line-color': '#4ADE80',
            'line-width': 4, 'line-opacity': 0.9
          }
        });

        // Marquage blanc central animé (tirets)
        hxMap.addLayer({
          id: 'hx-route-dash',
          type: 'line',
          source: 'hx-route',
          paint: {
            'line-color': 'rgba(255,255,255,0.7)',
            'line-width': 1.5,
            'line-dasharray': [4, 6]
          }
        });
      }

      // Ajuster la vue pour voir toute la route
      const coords = route.geometry.coordinates;
      const bounds = coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
      hxMap.fitBounds(bounds, { padding:{top:80,bottom:120,left:40,right:40}, maxZoom:16 });

    } else {
      // Fallback : ligne droite
      _tracerLigneDroite(userLL, {lng:destLon,lat:destLat});
      if(elStats) elStats.textContent = '📏 Estimation directe (réseau indisponible)';
    }
  } catch(e) {
    _tracerLigneDroite(userLL, {lng:destLon,lat:destLat});
    if(elStats) elStats.textContent = '📏 Ligne directe';
  }
}

/* ─── Ligne droite de fallback ─── */
function _tracerLigneDroite(from, to) {
  const geom = { type:'LineString', coordinates:[[from.lng,from.lat],[to.lng,to.lat]] };
  if(hxMap.getSource('hx-route')) {
    hxMap.getSource('hx-route').setData(geom);
  } else {
    hxMap.addSource('hx-route', { type:'geojson', data:geom });
    hxMap.addLayer({ id:'hx-route-glow', type:'line', source:'hx-route',
      paint:{ 'line-color':'rgba(74,222,128,0.2)', 'line-width':10, 'line-blur':4 }});
    hxMap.addLayer({ id:'hx-route-line', type:'line', source:'hx-route',
      paint:{ 'line-color':'#4ADE80', 'line-width':3,
              'line-dasharray':[6,4] }});
  }
}

/* ─── Annuler l'itinéraire ─── */
function annulerItineraire() {
  if(hxMap) {
    ['hx-route-glow','hx-route-line','hx-route-dash'].forEach(id => {
      try { if(hxMap.getLayer(id)) hxMap.removeLayer(id); } catch(e){}
    });
    try { if(hxMap.getSource('hx-route')) hxMap.removeSource('hx-route'); } catch(e){}
  }
  const panel = document.getElementById('route-info-panel');
  if(panel) panel.classList.add('hidden');
}

    userMarker.togglePopup();

/* ─── Fermer la carte ─── */
function fermerHailandMap() {
