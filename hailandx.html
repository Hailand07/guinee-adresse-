<style>
:root {
  /* Brand */
  --brand: #00C851;
  --brand-dark: #00a040;
  --brand-glow: rgba(0,200,81,.18);
  --accent: #FF6B35;
  --accent2: #FFD60A;
  --info: #3B82F6;

  /* Surfaces */
  --bg: #F0F4F0;
  --surface: #FFFFFF;
  --surface2: #F7FAF7;
  --overlay: rgba(0,0,0,.55);

  /* Text */
  --text: #111820;
  --muted: #6B7680;
  --text-inv: #ffffff;

  /* UI */
  --border: #E2E8E2;
  --radius: 20px;
  --radius-sm: 12px;
  --radius-xs: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,.07);
  --shadow-lg: 0 12px 48px rgba(0,0,0,.12);
  --transition: all .25s cubic-bezier(.4,0,.2,1);
}

/* ══════════════════════════════════════════════════════
   THÈME 2 : NUIT DORÉE — Élégance sombre & or guinéen
   Inspiré des couleurs du drapeau 🇬🇳 et du commerce
   de nuit à Conakry. Sobre, premium, lisible.
══════════════════════════════════════════════════════ */
[data-theme="night-gold"] {
  /* Brand → Or guinéen */
  --brand:      #F5A623;
  --brand-dark: #d4881a;
  --brand-glow: rgba(245,166,35,.18);
  --accent:     #E84855;
  --accent2:    #FFD60A;
  --info:       #60A5FA;

  /* Surfaces sombres */
  --bg:       #0D0F14;
  --surface:  #161B25;
  --surface2: #1E2535;
  --overlay:  rgba(0,0,0,.72);

  /* Texte sur fond sombre */
  --text:     #EEF0F6;
  --muted:    #7A8499;
  --text-inv: #0D0F14;

  /* UI */
  --border:    #2A3348;
  --shadow:    0 4px 24px rgba(0,0,0,.35);
  --shadow-lg: 0 12px 48px rgba(0,0,0,.55);
}

/* ── Polices du thème Nuit Dorée */
[data-theme="night-gold"] body {
  font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif;
}
[data-theme="night-gold"] .font-display,
[data-theme="night-gold"] h1,
[data-theme="night-gold"] h2,
[data-theme="night-gold"] .hero-title,
[data-theme="night-gold"] .topbar-map-title,
[data-theme="night-gold"] .dash-panel h3,
[data-theme="night-gold"] .stat-card .value,
[data-theme="night-gold"] .stat-box-val {
  font-family: 'Space Grotesk', sans-serif;
  letter-spacing: -.01em;
}

/* ── Hero Nuit Dorée */
[data-theme="night-gold"] .hero-wrap {
  background: linear-gradient(160deg,#05070d 0%,#0d0f14 55%,#1a0e04 100%);
}
[data-theme="night-gold"] .hero-title span   { color: var(--brand); }
[data-theme="night-gold"] .hero-glow  { background: radial-gradient(circle,rgba(245,166,35,.14) 0%,transparent 70%); }
[data-theme="night-gold"] .hero-glow2 { background: radial-gradient(circle,rgba(232,72,85,.10) 0%,transparent 70%); }
[data-theme="night-gold"] .hero-card  { background: rgba(255,255,255,.04); border-color: rgba(255,255,255,.08); }
[data-theme="night-gold"] .hero-card:hover { border-color: var(--brand); }
[data-theme="night-gold"] .hc-btn     { background: var(--brand); color: var(--text-inv); }

/* ── Boutons */
[data-theme="night-gold"] .btn-brand { background: var(--brand); color: var(--text-inv); }
[data-theme="night-gold"] .btn-brand:hover { background: var(--brand-dark); box-shadow: 0 8px 24px rgba(245,166,35,.3); }
[data-theme="night-gold"] .btn-ghost { background: var(--surface2); border-color: var(--border); color: var(--muted); }
[data-theme="night-gold"] .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
[data-theme="night-gold"] .btn-dark  { background: var(--surface2); color: var(--text); }

/* ── Formulaires */
[data-theme="night-gold"] .form-page { background: linear-gradient(160deg,#0d0f14,#161b25); }
[data-theme="night-gold"] .form-card { background: var(--surface); box-shadow: 0 0 0 1px var(--border), var(--shadow-lg); }
[data-theme="night-gold"] .form-group input,
[data-theme="night-gold"] .form-group select { background: var(--surface2); border-color: var(--border); color: var(--text); }
[data-theme="night-gold"] .form-group input:focus,
[data-theme="night-gold"] .form-group select:focus { border-color: var(--brand); background: var(--surface); }
[data-theme="night-gold"] .hx-dialog input { background: var(--surface2); border-color: var(--border); color: var(--text); }

/* ── Sidenav */
[data-theme="night-gold"] #sidenav { background: #0a0c10; }
[data-theme="night-gold"] .sidenav-top { background: linear-gradient(135deg,#0f1420,#0a0c10); border-bottom-color: rgba(245,166,35,.12); }
[data-theme="night-gold"] .sidenav-avatar { background: var(--brand); color: var(--text-inv); }
[data-theme="night-gold"] .sidenav-role   { color: var(--brand); }
[data-theme="night-gold"] .sidenav-item:hover { border-left-color: var(--brand); }

/* ── Produits / Cartes */
[data-theme="night-gold"] .product-card { background: var(--surface); border-color: var(--border); }
[data-theme="night-gold"] .product-card:hover { border-color: var(--brand); box-shadow: 0 8px 32px rgba(245,166,35,.15); }
[data-theme="night-gold"] .pc-img { background: linear-gradient(135deg,#1e2535,#161b25); }
[data-theme="night-gold"] .pc-price { color: var(--brand); }
[data-theme="night-gold"] .pc-cta  { background: var(--brand); color: var(--text-inv); }
[data-theme="night-gold"] .pc-badge-local { background: var(--brand); color: var(--text-inv); }

/* ── Stat cards / Panels */
[data-theme="night-gold"] .stat-card  { background: var(--surface); border-color: var(--border); box-shadow: var(--shadow); }
[data-theme="night-gold"] .stat-card.profit  { background: rgba(245,166,35,.06); border-color: rgba(245,166,35,.2); }
[data-theme="night-gold"] .stat-card.warning { background: rgba(232,72,85,.06); border-color: rgba(232,72,85,.2); }
[data-theme="night-gold"] .stat-card.info    { background: rgba(96,165,250,.06); border-color: rgba(96,165,250,.2); }
[data-theme="night-gold"] .stat-card.success { background: rgba(245,166,35,.06); border-color: rgba(245,166,35,.2); }
[data-theme="night-gold"] .stat-box   { background: var(--surface2); border-color: var(--border); }
[data-theme="night-gold"] .dash-panel { background: var(--surface); border-color: var(--border); }

/* ── Bouton action principal */
[data-theme="night-gold"] .btn-main { background: var(--brand); color: var(--text-inv); box-shadow: 0 4px 20px rgba(245,166,35,.3); }
[data-theme="night-gold"] .btn-main:hover { background: var(--brand-dark); box-shadow: 0 8px 32px rgba(245,166,35,.4); }
[data-theme="night-gold"] .btn-sec  { background: var(--surface2); border-color: var(--border); color: var(--text); }
[data-theme="night-gold"] .btn-sec:hover { border-color: var(--brand); color: var(--brand); }

/* ── Headers des espaces */
[data-theme="night-gold"] .header-v2 { background: linear-gradient(135deg,#0a0c10,#0f1420); }
[data-theme="night-gold"] .emoji-avatar { background: rgba(245,166,35,.12); border-color: var(--brand); }

/* ── Items inventaire / ventes */
[data-theme="night-gold"] .inv-item { border-bottom-color: var(--border); }
[data-theme="night-gold"] .item-gros { background: var(--surface); box-shadow: var(--shadow); }
[data-theme="night-gold"] .vente-row { background: var(--surface2); border-left-color: var(--brand); }
[data-theme="night-gold"] .pay-row   { background: var(--surface2); border-left-color: var(--brand); }
[data-theme="night-gold"] .order-chip { background: var(--surface2); border-color: var(--border); border-left-color: var(--info); }
[data-theme="night-gold"] .credit-row { background: var(--surface2); border-left-color: var(--accent); }
[data-theme="night-gold"] .mission-card { background: var(--surface); border-color: var(--border); }
[data-theme="night-gold"] .mission-card:hover { border-color: var(--brand); }
[data-theme="night-gold"] .mission-active { background: linear-gradient(135deg,rgba(245,166,35,.06),rgba(245,166,35,.03)); border-color: var(--brand); }
[data-theme="night-gold"] .mission-price { background: rgba(245,166,35,.1); border-color: rgba(245,166,35,.3); color: var(--brand); }

/* ── Modals vente */
[data-theme="night-gold"] .modal-vente { background: var(--bg); }
[data-theme="night-gold"] .modal-vente-header { background: #0a0c10; }
[data-theme="night-gold"] .btn-produit-select { background: var(--surface); border-color: var(--border); }
[data-theme="night-gold"] .btn-produit-select:hover { border-color: var(--brand); }
[data-theme="night-gold"] .btn-produit-select:active { background: rgba(245,166,35,.08); border-color: var(--brand); }
[data-theme="night-gold"] .checkout-bar { background: var(--surface); border-top-color: var(--border); }
[data-theme="night-gold"] .btn-valider-vente { background: var(--brand); color: var(--text-inv); }
[data-theme="night-gold"] .panier-chip { background: rgba(245,166,35,.12); border-color: var(--brand); color: var(--brand); }

/* ── Livreur */
[data-theme="night-gold"] .gps-status-bar { background: var(--surface); border-color: var(--border); }
[data-theme="night-gold"] .status-dot { background: var(--brand); }
[data-theme="night-gold"] .zone-chip { background: rgba(245,166,35,.1); border-color: var(--brand); color: var(--brand); }

/* ── HailandMap */
[data-theme="night-gold"] .map-overlay { background: var(--bg); }
[data-theme="night-gold"] .topbar-map  { background: rgba(13,15,20,.96); border-bottom-color: var(--border); }
[data-theme="night-gold"] .topbar-map-title span { color: var(--brand); }
[data-theme="night-gold"] .map-bottom-bar { background: rgba(13,15,20,.97); border-top-color: var(--border); }
[data-theme="night-gold"] .route-info-panel { background: var(--surface); border-color: var(--brand); }
[data-theme="night-gold"] .btn-lock-zone { background: linear-gradient(135deg,var(--brand),var(--brand-dark)); color: var(--text-inv); box-shadow: 0 4px 16px rgba(245,166,35,.4); }
[data-theme="night-gold"] .locked-address-chip { background: rgba(245,166,35,.1); border-color: var(--brand); color: var(--brand); }
[data-theme="night-gold"] .lock-confirm-panel { background: var(--surface); border-color: var(--brand); }
[data-theme="night-gold"] .btq-dot { background: var(--brand); box-shadow: 0 0 0 3px rgba(245,166,35,.2),0 3px 8px rgba(245,166,35,.3); }
[data-theme="night-gold"] .user-pos-marker { background: var(--info); }
[data-theme="night-gold"] .area-label-inner { background: var(--brand); color: var(--text-inv); }
@keyframes pulse-blue-gold { /* remplace pulse-blue en thème gold */
  0%,100%{ box-shadow:0 0 0 4px rgba(96,165,250,.25),0 4px 12px rgba(96,165,250,.4); }
  50%    { box-shadow:0 0 0 10px rgba(96,165,250,.08),0 4px 12px rgba(96,165,250,.4); }
}
[data-theme="night-gold"] .user-pos-marker { animation: pulse-blue-gold 2s infinite; }

/* ── Importateur */
[data-theme="night-gold"] .cargaison-card { background: var(--surface); border-color: var(--border); }
[data-theme="night-gold"] .grossiste-network-card { background: var(--surface); border-color: var(--border); }
[data-theme="night-gold"] .penury-alert.critical { background: rgba(232,72,85,.1); }
[data-theme="night-gold"] .penury-alert.warning  { background: rgba(245,166,35,.1); }
[data-theme="night-gold"] .ai-insight { background: rgba(96,165,250,.08); border-left-color: var(--info); color: var(--text); }
[data-theme="night-gold"] .btn-import { background: var(--surface); color: var(--text); border-color: var(--border); box-shadow: var(--shadow); }
[data-theme="night-gold"] .btn-import:hover { border-color: var(--brand); box-shadow: 0 8px 24px rgba(245,166,35,.2); }

/* ── Toasts & Dialog */
[data-theme="night-gold"] .hx-toast   { background: var(--surface); color: var(--text); box-shadow: var(--shadow-lg); }
[data-theme="night-gold"] .hx-toast.success { background: var(--brand); color: var(--text-inv); }
[data-theme="night-gold"] .hx-toast.error   { background: #E84855; color: #fff; }
[data-theme="night-gold"] .hx-toast.warn    { background: #D97706; color: #fff; }
[data-theme="night-gold"] .hx-dialog { background: var(--surface); }

/* ── QR Page */
[data-theme="night-gold"] .qr-page { background: var(--surface); }
[data-theme="night-gold"] #qrcode-container { background: #fff; border-color: var(--border); }

/* ── Recherche */
[data-theme="night-gold"] .search-wrap input { background: var(--surface); border-color: var(--border); color: var(--text); }
[data-theme="night-gold"] .search-wrap input:focus { border-color: var(--brand); }
[data-theme="night-gold"] .search-box input { background: var(--surface); border-color: var(--border); color: var(--text); }

/* ── Menu trigger */
[data-theme="night-gold"] #menu-trigger { background: var(--surface); color: var(--text); }

/* ── Offline banner */
[data-theme="night-gold"] #offline-banner { background: #D97706; color: #fff; }

/* ── Loading */
[data-theme="night-gold"] #loading-screen { background: #0a0c10; }

/* ══════════════════════════════════
   SÉLECTEUR DE THÈME dans le menu
══════════════════════════════════ */
.theme-switcher {
  margin: 8px 16px 4px;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: var(--radius-sm);
  padding: 4px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
}
.theme-btn {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 8px; border-radius: 8px; border: none;
  cursor: pointer; transition: var(--transition);
  font-family: inherit; font-size: .7rem; font-weight: 700;
  background: transparent; color: rgba(255,255,255,.5);
  line-height: 1.3;
}
.theme-btn:hover { background: rgba(255,255,255,.08); color: rgba(255,255,255,.85); }
.theme-btn.active {
  background: rgba(255,255,255,.12);
  color: #fff;
  box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.18);
}
.theme-btn .tb-icon { font-size: 1.3rem; }
.theme-btn .tb-dot {
  width: 28px; height: 6px; border-radius: 3px; margin-top: 4px;
}
.theme-btn[data-t="emerald"] .tb-dot { background: linear-gradient(90deg,#00C851,#00a040); }
.theme-btn[data-t="night-gold"] .tb-dot { background: linear-gradient(90deg,#F5A623,#E84855); }

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html { scroll-behavior:smooth; -webkit-tap-highlight-color:transparent; }

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── UTILS ── */
.hidden { display:none !important; }
.sr-only { position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0); }

/* ── TYPOGRAPHY ── */
.font-display { font-family:'Sora',sans-serif; }

/* ── MODAL TOAST SYSTEM (remplace alert/confirm/prompt) ── */
#hx-toast-container {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 9999; display:flex; flex-direction:column; gap:10px;
  align-items:center; pointer-events:none;
}
.hx-toast {
  background: var(--text); color:#fff;
  padding: 14px 22px; border-radius:50px;
  font-size:.9rem; font-weight:600;
  box-shadow: 0 8px 32px rgba(0,0,0,.25);
  animation: toastIn .3s ease forwards;
  pointer-events: all;
  max-width: 340px; text-align:center;
  display:flex; align-items:center; gap:8px;
}
.hx-toast.success { background:var(--brand); }
.hx-toast.error   { background:#EF4444; }
.hx-toast.warn    { background:#F59E0B; color:#000; }
@keyframes toastIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
@keyframes toastOut { to{opacity:0;transform:translateY(20px)} }

/* ── DIALOG (remplace confirm/prompt) ── */
#hx-dialog-overlay {
  position:fixed; inset:0; background:var(--overlay);
  z-index:8000; display:flex; align-items:flex-end; justify-content:center;
  backdrop-filter:blur(6px);
  animation: fadeIn .2s ease;
}
.hx-dialog {
  background: var(--surface); border-radius:var(--radius) var(--radius) 0 0;
  width:100%; max-width:480px; padding:28px 24px 36px;
  animation: slideUp .3s ease;
}
.hx-dialog h3 { font-family:'Sora',sans-serif; font-size:1.2rem; margin-bottom:8px; }
.hx-dialog p  { color:var(--muted); font-size:.9rem; margin-bottom:20px; line-height:1.6; }
.hx-dialog input {
  width:100%; padding:14px 16px; border:2px solid var(--border);
  border-radius:var(--radius-sm); font-family:inherit; font-size:1rem;
  margin-bottom:16px; outline:none; transition:var(--transition);
}
.hx-dialog input:focus { border-color:var(--brand); }
.hx-dialog-btns { display:flex; gap:10px; }
.hx-dialog-btns button { flex:1; padding:14px; border:none; border-radius:var(--radius-sm);
  font-family:inherit; font-weight:700; font-size:1rem; cursor:pointer; transition:var(--transition); }
.hx-btn-confirm { background:var(--brand); color:#fff; }
.hx-btn-cancel  { background:var(--surface2); color:var(--muted); }
.hx-btn-confirm:hover { background:var(--brand-dark); }

@keyframes fadeIn  { from{opacity:0} to{opacity:1} }
@keyframes slideUp { from{transform:translateY(60px)} to{transform:none} }

/* ── SIDENAV ── */
#sidenav-overlay {
  position:fixed; inset:0; background:var(--overlay);
  z-index:2000; opacity:0; pointer-events:none; transition:opacity .3s;
  backdrop-filter:blur(4px);
}
#sidenav-overlay.open { opacity:1; pointer-events:all; }

#sidenav {
  position:fixed; left:0; top:0; bottom:0; width:300px;
  background:var(--text); z-index:2001;
  transform:translateX(-100%); transition:transform .35s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column; overflow:hidden;
}
#sidenav.open { transform:none; }

.sidenav-top {
  padding:48px 24px 24px;
  background: linear-gradient(135deg,#1a2e1a,#111820);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.sidenav-avatar {
  width:52px; height:52px; border-radius:50%;
  background:var(--brand); display:flex; align-items:center;
  justify-content:center; font-size:1.4rem; font-weight:800;
  color:#fff; margin-bottom:12px;
}
.sidenav-name { color:#fff; font-weight:700; font-size:1rem; }
.sidenav-role { color:var(--brand); font-size:.78rem; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }

.sidenav-body { flex:1; overflow-y:auto; padding:16px 0; }
.sidenav-section-label {
  padding:12px 24px 6px;
  font-size:.7rem; color:rgba(255,255,255,.35);
  text-transform:uppercase; letter-spacing:1px; font-weight:700;
}
.sidenav-item {
  display:flex; align-items:center; gap:14px;
  padding:14px 24px; color:rgba(255,255,255,.7);
  cursor:pointer; transition:var(--transition);
  border-left:3px solid transparent;
  font-weight:600; font-size:.95rem;
}
.sidenav-item:hover { background:rgba(255,255,255,.05); color:#fff; border-left-color:var(--brand); }
.sidenav-item.danger { color:#F87171; }
.sidenav-item.highlight { color:var(--accent2); }
.sidenav-item-icon { font-size:1.1rem; width:24px; text-align:center; }

/* ── MENU TRIGGER ── */
#menu-trigger {
  position:fixed; top:20px; left:20px; z-index:1999;
  width:48px; height:48px; border-radius:var(--radius-sm);
  background:var(--surface); border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow); font-size:1.2rem;
  transition:var(--transition);
}
#menu-trigger:active { transform:scale(.94); }

/* ── OFFLINE BANNER ── */
#offline-banner {
  position:fixed; top:0; left:0; right:0; z-index:7000;
  background:#F59E0B; color:#000;
  padding:10px 20px; text-align:center;
  font-size:.85rem; font-weight:700;
  transform:translateY(-100%); transition:transform .3s;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
#offline-banner.show { transform:none; }

/* ── LOADING SCREEN ── */
#loading-screen {
  position:fixed; inset:0; background:var(--text);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:9000; transition:opacity .5s;
}
.loading-logo { font-family:'Sora',sans-serif; font-size:2.5rem; color:var(--brand); margin-bottom:16px; }
.loading-bar-wrap { width:160px; height:4px; background:rgba(255,255,255,.1); border-radius:99px; overflow:hidden; }
.loading-bar { height:100%; background:var(--brand); border-radius:99px; animation:loadBar 1.5s ease forwards; }
@keyframes loadBar { from{width:0} to{width:100%} }

/* ── MAIN CONTENT ── */
#main-content { min-height:100vh; }

/* ══════════════════════════════════
   HERO / ACCUEIL
══════════════════════════════════ */
.hero-wrap {
  min-height:100vh;
  background: linear-gradient(160deg, #0d1f0d 0%, #111820 60%, #1a0a00 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:80px 24px 60px; text-align:center; position:relative; overflow:hidden;
}
.hero-glow {
  position:absolute; width:500px; height:500px; border-radius:50%;
  background:radial-gradient(circle, rgba(0,200,81,.15) 0%, transparent 70%);
  top:-100px; left:50%; transform:translateX(-50%); pointer-events:none;
}
.hero-glow2 {
  position:absolute; width:300px; height:300px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,107,53,.1) 0%, transparent 70%);
  bottom:80px; right:-60px; pointer-events:none;
}
.hero-flag {
  font-size:2.5rem; margin-bottom:24px;
  animation: bounceIn .6s ease both;
}
.hero-title {
  font-family:'Sora',sans-serif;
  font-size:clamp(2.5rem,10vw,5rem);
  color:#fff; line-height:1.05; margin-bottom:16px;
  animation: fadeUp .7s ease .1s both;
}
.hero-title span { color:var(--brand); }
.hero-sub {
  color:rgba(255,255,255,.6); font-size:1rem; max-width:480px; line-height:1.8;
  margin-bottom:48px; animation:fadeUp .7s ease .2s both;
}
.hero-cards {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px; width:100%; max-width:700px; animation:fadeUp .7s ease .3s both;
}
.hero-card {
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-radius:var(--radius); padding:28px 20px;
  cursor:pointer; transition:var(--transition);
  position:relative; overflow:hidden;
}
.hero-card::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(0,200,81,.08),transparent);
  opacity:0; transition:var(--transition);
}
.hero-card:hover { border-color:var(--brand); transform:translateY(-6px); }
.hero-card:hover::after { opacity:1; }
.hero-card:active { transform:scale(.97); }
.hc-icon { font-size:2.2rem; margin-bottom:12px; }
.hc-title { font-family:'Sora',sans-serif; font-size:1.1rem; color:#fff; margin-bottom:6px; }
.hc-desc { font-size:.8rem; color:rgba(255,255,255,.5); line-height:1.6; }
.hc-btn {
  margin-top:16px; padding:9px 18px;
  background:var(--brand); color:#fff;
  border:none; border-radius:50px;
  font-weight:700; font-size:.82rem; cursor:pointer;
  transition:var(--transition);
}
.hc-btn:hover { background:var(--brand-dark); }

.hero-footer {
  margin-top:48px; color:rgba(255,255,255,.3);
  font-size:.78rem; animation:fadeUp .7s ease .5s both;
}

@keyframes bounceIn { from{transform:scale(0);opacity:0} 60%{transform:scale(1.2)} to{transform:scale(1);opacity:1} }
@keyframes fadeUp   { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:none} }

/* ══════════════════════════════════
   FORMULAIRES
══════════════════════════════════ */
.form-page {
  min-height:100vh; padding:60px 20px 40px;
  display:flex; align-items:center; justify-content:center;
  background: linear-gradient(160deg,#f0faf0,#eef2ee);
}
.form-card {
  background:var(--surface); border-radius:var(--radius);
  padding:32px 28px; width:100%; max-width:440px;
  box-shadow:var(--shadow-lg); animation:fadeUp .4s ease;
}
.form-card-icon { font-size:2.5rem; margin-bottom:12px; }
.form-card h2 { font-family:'Sora',sans-serif; font-size:1.4rem; margin-bottom:6px; }
.form-card p { color:var(--muted); font-size:.88rem; margin-bottom:24px; line-height:1.6; }
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-weight:600; font-size:.85rem; margin-bottom:8px; }
.form-group input, .form-group select {
  width:100%; padding:13px 16px; border:2px solid var(--border);
  border-radius:var(--radius-sm); font-family:inherit; font-size:.95rem;
  outline:none; transition:var(--transition); background:var(--surface2);
  color:var(--text);
}
.form-group input:focus, .form-group select:focus { border-color:var(--brand); background:#fff; }

.gps-box {
  background:var(--surface2); border:2px dashed var(--border);
  border-radius:var(--radius-sm); padding:20px; text-align:center;
  margin-bottom:16px; transition:var(--transition);
}
.gps-box.ok   { background:#f0fff4; border-color:var(--brand); }
.gps-box.warn { background:#fffbeb; border-color:#F59E0B; }
.gps-icon { font-size:2rem; margin-bottom:8px; }
.gps-text { font-weight:600; font-size:.85rem; color:var(--muted); margin-bottom:12px; }

/* ── BUTTONS ── */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:13px 24px; border:none; border-radius:var(--radius-sm);
  font-family:inherit; font-weight:700; font-size:.95rem;
  cursor:pointer; transition:var(--transition); text-decoration:none;
}
.btn:active { transform:scale(.97); }
.btn:disabled { opacity:.45; pointer-events:none; }
.btn-full { width:100%; }
.btn-brand  { background:var(--brand); color:#fff; }
.btn-brand:hover  { background:var(--brand-dark); box-shadow:0 8px 24px rgba(0,200,81,.25); }
.btn-info   { background:var(--info); color:#fff; }
.btn-accent { background:var(--accent); color:#fff; }
.btn-accent:hover { background:#e55a22; }
.btn-ghost  { background:var(--surface2); color:var(--muted); border:2px solid var(--border); }
.btn-ghost:hover { color:var(--text); border-color:var(--text); }
.btn-danger { background:#FEE2E2; color:#EF4444; }
.btn-danger:hover { background:#EF4444; color:#fff; }
.btn-dark { background:var(--text); color:#fff; }
.btn-sm { padding:9px 16px; font-size:.85rem; }
.btn-round { border-radius:50px; }

/* ══════════════════════════════════
   CLIENT – CATALOGUE
══════════════════════════════════ */
.client-page { padding:72px 20px 120px; max-width:960px; margin:0 auto; }

.client-topbar {
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; margin-bottom:24px; flex-wrap:wrap;
}
.topbar-title { font-family:'Sora',sans-serif; font-size:1.5rem; }
.zone-chip {
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 14px; background:var(--brand-glow);
  border:1.5px solid var(--brand); border-radius:50px;
  font-size:.82rem; font-weight:700; color:var(--brand);
  cursor:pointer; transition:var(--transition);
}
.zone-chip:hover { background:rgba(0,200,81,.25); }

.topbar-actions { display:flex; gap:8px; }

.search-wrap {
  position:relative; margin-bottom:20px;
}
.search-wrap input {
  width:100%; padding:14px 16px 14px 46px;
  border:2px solid var(--border); border-radius:50px;
  font-family:inherit; font-size:.95rem; outline:none;
  background:var(--surface); transition:var(--transition);
}
.search-wrap input:focus { border-color:var(--brand); }
.search-icon { position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:1.1rem; color:var(--muted); }

.product-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
  gap:14px;
}

.product-card {
  background:var(--surface); border-radius:var(--radius);
  overflow:hidden; border:1.5px solid var(--border);
  transition:var(--transition); cursor:pointer;
  animation:fadeUp .35s ease both;
}
.product-card:hover { border-color:var(--brand); transform:translateY(-5px); box-shadow:var(--shadow); }
.product-card:active { transform:scale(.97); }

.pc-img {
  height:130px; background:linear-gradient(135deg,#e8f5e9,#f0f4f0);
  display:flex; align-items:center; justify-content:center; font-size:3rem;
  position:relative;
}
.pc-badge-local {
  position:absolute; top:8px; left:8px;
  background:var(--brand); color:#fff;
  font-size:.65rem; font-weight:800; padding:3px 8px;
  border-radius:50px; letter-spacing:.3px;
}
.pc-body { padding:12px; }
.pc-name { font-weight:700; font-size:.88rem; line-height:1.3; margin-bottom:4px; }
.pc-zone { font-size:.72rem; color:var(--muted); margin-bottom:8px; }
.pc-price { font-family:'Sora',sans-serif; font-size:1rem; color:var(--brand); font-weight:700; }
.pc-cta {
  width:100%; padding:10px; background:var(--brand);
  color:#fff; border:none; font-weight:700; font-size:.85rem;
  cursor:pointer; transition:var(--transition);
}
.pc-cta:hover { background:var(--brand-dark); }

/* empty / loading */
.empty-state {
  grid-column:1/-1; text-align:center; padding:60px 20px;
}
.empty-icon { font-size:3.5rem; margin-bottom:12px; }
.empty-title { font-family:'Sora',sans-serif; font-size:1.1rem; margin-bottom:6px; }
.empty-sub { color:var(--muted); font-size:.88rem; }

.spinner-wrap { grid-column:1/-1; display:flex; justify-content:center; padding:40px; }
.spinner {
  width:40px; height:40px; border-radius:50%;
  border:3px solid var(--border); border-top-color:var(--brand);
  animation:spin .7s linear infinite;
}
@keyframes spin { to{transform:rotate(360deg)} }

/* ══════════════════════════════════
   SCANNER CLIENT (confirmation)
══════════════════════════════════ */
.scanner-overlay {
  position:fixed; inset:0; background:#000; z-index:5000;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  animation:fadeIn .3s ease;
}
.scanner-overlay h3 { color:#fff; font-family:'Sora',sans-serif; margin-bottom:16px; }
#client-reader { width:min(320px,90vw); border-radius:var(--radius); overflow:hidden; border:3px solid var(--brand); }
.scanner-close {
  margin-top:20px; padding:12px 28px;
  background:#fff; color:#000; border:none;
  border-radius:50px; font-weight:700; cursor:pointer;
}

/* ══════════════════════════════════
   PAYMENT MODAL
══════════════════════════════════ */
#payment-modal {
  position:fixed; inset:0; z-index:6000;
  background:var(--overlay); display:none;
  align-items:flex-end; justify-content:center;
  backdrop-filter:blur(6px);
}
#payment-modal.open { display:flex; animation:fadeIn .2s ease; }
.payment-box {
  background:var(--surface); border-radius:var(--radius) var(--radius) 0 0;
  padding:28px 24px 40px; width:100%; max-width:480px;
  animation:slideUp .35s ease;
}
.payment-title { font-family:'Sora',sans-serif; font-size:1.2rem; margin-bottom:8px; }
.payment-amount { font-family:'Sora',sans-serif; font-size:2rem; color:var(--brand); margin-bottom:24px; }
.payment-options { display:flex; flex-direction:column; gap:10px; }
.pay-opt {
  display:flex; align-items:center; gap:14px;
  padding:16px 20px; border-radius:var(--radius-sm);
  border:2px solid var(--border); background:var(--surface2);
  cursor:pointer; transition:var(--transition); font-weight:600;
}
.pay-opt:hover { border-color:var(--brand); background:var(--brand-glow); }
.pay-opt-icon { font-size:1.6rem; }
.pay-opt-cancel { color:var(--muted); text-align:center; padding-top:12px; font-size:.88rem; cursor:pointer; }
.pay-opt-cancel:hover { color:var(--text); }

/* ══════════════════════════════════
   FOURNISSEUR
══════════════════════════════════ */
.supplier-portal {
  min-height:100vh; padding:72px 20px 40px;
  background: linear-gradient(170deg, #0a1a0a 0%, #111820 100%);
}
.supplier-portal-title {
  font-family:'Sora',sans-serif; font-size:2rem; color:#fff;
  text-align:center; margin-bottom:8px;
}
.supplier-portal-sub { color:rgba(255,255,255,.5); text-align:center; margin-bottom:40px; }
.supplier-type-grid {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px; max-width:760px; margin:0 auto;
}
.supplier-type-card {
  background:rgba(255,255,255,.05); border:1.5px solid rgba(255,255,255,.1);
  border-radius:var(--radius); padding:32px 20px; text-align:center;
  cursor:pointer; transition:var(--transition);
}
.supplier-type-card:hover { border-color:var(--brand); background:rgba(0,200,81,.08); transform:translateY(-6px); }
.supplier-type-card:active { transform:scale(.97); }
.stc-icon { font-size:2.5rem; margin-bottom:12px; }
.stc-title { font-family:'Sora',sans-serif; color:#fff; font-size:1.1rem; margin-bottom:6px; }
.stc-desc { color:rgba(255,255,255,.45); font-size:.8rem; line-height:1.6; }
.stc-cta {
  margin-top:16px; padding:9px 20px;
  background:var(--brand); color:#fff; border:none;
  border-radius:50px; font-weight:700; font-size:.8rem; cursor:pointer;
}

/* DASHBOARD FOURNISSEUR */
.supplier-dash {
  padding:72px 20px 40px; max-width:1100px; margin:0 auto;
}
.dash-header {
  display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:12px; margin-bottom:28px;
}
.dash-header-left h2 { font-family:'Sora',sans-serif; font-size:1.5rem; }
.dash-header-left p  { color:var(--muted); font-size:.85rem; margin-top:4px; }

.dash-layout { display:grid; grid-template-columns:360px 1fr; gap:24px; }
@media(max-width:800px) { .dash-layout { grid-template-columns:1fr; } }

.dash-panel {
  background:var(--surface); border-radius:var(--radius);
  border:1.5px solid var(--border); padding:24px;
  box-shadow:var(--shadow);
}
.dash-panel h3 { font-family:'Sora',sans-serif; font-size:1rem; margin-bottom:20px;
  display:flex; align-items:center; gap:8px; }

.stat-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
.stat-box { background:var(--surface2); border-radius:var(--radius-sm); padding:16px; text-align:center; border:1.5px solid var(--border); }
.stat-box-val { font-family:'Sora',sans-serif; font-size:1.6rem; color:var(--brand); font-weight:800; }
.stat-box-label { font-size:.72rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.4px; margin-top:4px; }

.scan-trigger {
  width:100%; padding:13px; background:var(--surface2);
  border:2px dashed var(--border); border-radius:var(--radius-sm);
  font-family:inherit; font-weight:700; font-size:.9rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:var(--transition); color:var(--text); margin-bottom:16px;
}
.scan-trigger:hover { border-color:var(--brand); color:var(--brand); background:var(--brand-glow); }
#reader {
  width:100%; border-radius:var(--radius-sm); overflow:hidden;
  background:#000; border:2px solid var(--brand); display:none; min-height:200px;
  margin-bottom:12px;
}
.scan-status { font-size:.82rem; font-weight:600; color:var(--muted); text-align:center; margin-bottom:16px; min-height:18px; }

.inventory-list { display:flex; flex-direction:column; }
.inv-item {
  display:flex; align-items:center; gap:12px;
  padding:14px 0; border-bottom:1px solid var(--border);
  animation:fadeUp .3s ease;
}
.inv-item:last-child { border-bottom:none; }
.inv-item-icon { font-size:1.8rem; flex-shrink:0; }
.inv-item-info { flex:1; }
.inv-item-name { font-weight:700; font-size:.9rem; }
.inv-item-sub  { font-size:.78rem; color:var(--muted); margin-top:2px; }
.inv-item-price { font-family:'Sora',sans-serif; color:var(--brand); font-weight:700; font-size:.95rem; }
.inv-del-btn {
  width:32px; height:32px; border-radius:50%; background:#FEE2E2;
  border:none; color:#EF4444; cursor:pointer; font-size:.9rem;
  display:flex; align-items:center; justify-content:center; transition:var(--transition);
}
.inv-del-btn:hover { background:#EF4444; color:#fff; }

/* commandes zone */
.order-chip {
  background:var(--surface2); border:1.5px solid var(--border);
  border-left:4px solid var(--info); border-radius:var(--radius-sm);
  padding:14px 16px; margin-bottom:10px; animation:fadeUp .3s ease;
}
.order-chip h4 { font-size:.9rem; margin-bottom:4px; }
.order-chip p  { font-size:.78rem; color:var(--muted); margin-top:2px; }
.order-chip .price-tag { color:var(--brand); font-weight:700; margin-top:6px; }

/* paiements */
.pay-row {
  display:flex; justify-content:space-between; align-items:center;
  padding:12px; background:var(--surface2); border-radius:var(--radius-xs);
  border-left:4px solid var(--brand); margin-bottom:8px;
}

/* ══════════════════════════════════
   LIVREUR
══════════════════════════════════ */
.livreur-page { padding:72px 20px 40px; max-width:600px; margin:0 auto; }
.livreur-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
.gps-status-bar {
  display:flex; align-items:center; gap:10px;
  background:var(--surface); border-radius:var(--radius-sm);
  padding:12px 16px; border:1.5px solid var(--border); margin-bottom:20px;
}
.status-dot { width:10px; height:10px; border-radius:50%; background:var(--brand); animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(0,200,81,.4)} 50%{opacity:.7;box-shadow:0 0 0 6px rgba(0,200,81,0)} }

.mission-card {
  background:var(--surface); border-radius:var(--radius);
  border:1.5px solid var(--border); padding:20px;
  box-shadow:var(--shadow); margin-bottom:14px;
  animation:fadeUp .35s ease;
  transition:var(--transition);
}
.mission-card:hover { border-color:var(--brand); box-shadow:var(--shadow-lg); }
.mission-header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; }
.mission-info h4 { font-weight:700; margin-bottom:4px; }
.mission-info p  { font-size:.82rem; color:var(--muted); }
.mission-price {
  background:var(--brand-glow); border:1.5px solid var(--brand);
  border-radius:var(--radius-sm); padding:10px 16px;
  font-family:'Sora',sans-serif; color:var(--brand); font-weight:800; font-size:1.1rem;
  white-space:nowrap;
}
.mission-active {
  background:linear-gradient(135deg,#f0fff4,#e8f5e9);
  border-color:var(--brand);
}

/* QR confirmation page */
.qr-page {
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  justify-content:center; padding:40px 24px; text-align:center;
  background:var(--surface);
}
.qr-page h2 { font-family:'Sora',sans-serif; font-size:1.5rem; margin-bottom:8px; }
.qr-page p  { color:var(--muted); margin-bottom:24px; font-size:.9rem; }
#qrcode-container {
  padding:20px; background:white; border-radius:var(--radius);
  box-shadow:var(--shadow); border:2px solid var(--border); margin-bottom:24px;
}
.qr-id { font-size:.78rem; color:var(--muted); font-family:monospace; margin-bottom:24px; }

/* ══════════════════════════════════
   RESPONSIVE
══════════════════════════════════ */
@media(max-width:480px) {
  .hero-cards { grid-template-columns:1fr; }
  .product-grid { grid-template-columns:repeat(2,1fr); }
  .dash-panel { padding:18px; }
}

/* ══════════════════════════════════
   DASHBOARD GROSSISTE – Logistique
══════════════════════════════════ */
.stat-card.info { border-color: rgba(59,130,246,.3); background: #eff6ff; }
.stat-card.info .value { color: var(--info); }

.action-bar.vertical {
  grid-template-columns: 1fr;
  gap: 10px;
}
.action-bar.vertical .btn-sec {
  flex-direction: row; justify-content: flex-start;
  gap: 10px; padding: 14px 18px;
}

/* Grille stock gros */
.gros-list {
  display: flex; flex-direction: column; gap: 10px;
  padding: 0 16px 20px;
}
.item-gros {
  background: var(--surface); border-radius: var(--radius-sm);
  padding: 16px; display: flex; align-items: center; gap: 12px;
  border-left: 5px solid var(--info); box-shadow: var(--shadow);
  animation: fadeUp .3s ease; transition: var(--transition);
}
.item-gros:hover { box-shadow: var(--shadow-lg); }
.item-gros.low  { border-left-color: #EF4444; }
.item-gros.ok   { border-left-color: var(--brand); }
.item-gros-info { flex:1; }
.item-gros-name { font-weight:700; font-size:.9rem; margin-bottom:3px; }
.item-gros-sub  { font-size:.76rem; color:var(--muted); }
.item-gros-right { text-align:right; flex-shrink:0; }
.volume-badge {
  display:inline-block; background:var(--surface2); border:1.5px solid var(--border);
  padding: 4px 10px; border-radius: var(--radius-xs);
  font-size: .75rem; font-weight: 800; color: var(--text);
  margin-bottom: 4px;
}
.volume-badge.palette { border-color:var(--info); color:var(--info); background:#eff6ff; }
.volume-badge.carton  { border-color:var(--brand); color:var(--brand); background:#f0fff4; }
.item-gros-price { font-family:'Sora',sans-serif; font-size:.95rem; color:var(--brand); font-weight:800; }

/* Modal Arrivage / Vente Gros */
.modal-gros-header {
  background: linear-gradient(135deg,#1a1f3a,#111820);
  padding: 50px 16px 16px;
  display: flex; align-items:center; justify-content:space-between;
  position: sticky; top:0; z-index:1;
}
.modal-gros-header h3 { font-family:'Sora',sans-serif; color:#fff; font-size:1.1rem; }

/* Panier B2B */
.b2b-product-row {
  display:flex; align-items:center; gap:10px;
  background: var(--surface2); border-radius: var(--radius-xs);
  padding:12px; border:1.5px solid var(--border); margin-bottom:8px;
  transition: var(--transition);
}
.b2b-product-row:hover { border-color:var(--info); }
.b2b-product-row .b2b-name { flex:1; font-weight:700; font-size:.88rem; }
.b2b-product-row input[type="number"] {
  width:70px; padding:8px; border:2px solid var(--border); border-radius:var(--radius-xs);
  font-family:inherit; font-size:.9rem; text-align:center; outline:none;
}
.b2b-product-row input:focus { border-color:var(--info); }
.b2b-product-row .b2b-unit { font-size:.75rem; color:var(--muted); font-weight:600; }
.b2b-product-row .b2b-sous-total { font-family:'Sora',sans-serif; color:var(--brand); font-weight:800; font-size:.9rem; min-width:80px; text-align:right; }

/* Crédit / Cahier */
.credit-row {
  display:flex; justify-content:space-between; align-items:center;
  padding:14px; background:var(--surface2); border-radius:var(--radius-xs);
  border-left:4px solid var(--accent); margin-bottom:8px; animation:fadeUp .3s ease;
}
.credit-row .cr-nom { font-weight:700; font-size:.88rem; }
.credit-row .cr-tel { font-size:.75rem; color:var(--muted); margin-top:2px; }
.credit-row .cr-montant { font-family:'Sora',sans-serif; color:var(--accent); font-weight:800; font-size:1rem; }
.credit-badge-paid { color: var(--brand) !important; }

/* Section titre avec ligne */
.section-title-bar {
  display:flex; align-items:center; justify-content:space-between;
  padding: 16px 16px 8px;
}
.section-title-bar h3 { font-family:'Sora',sans-serif; font-size:1rem; }

/* ══════════════════════════════════
   TOUR DE CONTRÔLE IMPORTATEUR
══════════════════════════════════ */
.import-header {
  background: linear-gradient(135deg, #1a2a6c 0%, #b21f1f 60%, #fdbb2d 100%);
}
.status-badge.gold {
  background: rgba(253,187,45,.18);
  color: #FFD60A;
  border: 1px solid rgba(253,187,45,.6);
}
.stat-card.success { border-color: rgba(0,200,81,.3); background: #f0fff4; }
.stat-card.success .value { color: var(--brand); }

/* Grille 2×2 boutons import */
.action-bar-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 12px 16px 8px;
}
.btn-import {
  background: var(--surface);
  border: 1.5px solid var(--border);
  padding: 18px 12px;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  font-family: inherit; font-weight: 700; font-size: .82rem;
  color: #1a2a6c; cursor: pointer; transition: var(--transition);
  text-align: center; line-height: 1.3;
}
.btn-import:hover { border-color: #1a2a6c; box-shadow: var(--shadow-lg); transform: translateY(-3px); }
.btn-import:active { transform: scale(.97); }
.btn-import .icon { font-size: 1.6rem; }

/* Cargaison card */
.cargaison-card {
  background: var(--surface); border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); padding: 16px;
  margin-bottom: 10px; box-shadow: var(--shadow);
  animation: fadeUp .3s ease; transition: var(--transition);
  position: relative; overflow: hidden;
}
.cargaison-card:hover { box-shadow: var(--shadow-lg); }
.cargaison-card::before {
  content:''; position:absolute; left:0; top:0; bottom:0; width:5px;
}
.cargaison-card.en_transit::before  { background: var(--info); }
.cargaison-card.en_douane::before   { background: var(--accent); }
.cargaison-card.disponible::before  { background: var(--brand); }
.cargaison-card.dédouanée::before  { background: var(--brand); }
.carg-header { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:10px; }
.carg-nom { font-weight:800; font-size:.92rem; margin-bottom:3px; }
.carg-meta { font-size:.76rem; color:var(--muted); line-height:1.5; }
.carg-statut-badge {
  display:inline-flex; align-items:center; gap:5px;
  padding:5px 10px; border-radius:50px; font-size:.72rem; font-weight:800;
  white-space: nowrap; flex-shrink:0;
}
.badge-transit  { background:#eff6ff; color:var(--info); border:1.5px solid rgba(59,130,246,.3); }
.badge-douane   { background:#fff7ed; color:var(--accent); border:1.5px solid rgba(255,107,53,.3); }
.badge-dispo    { background:#f0fff4; color:var(--brand); border:1.5px solid rgba(0,200,81,.3); }
.carg-footer { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; padding-top:10px; border-top:1px solid var(--border); }
.carg-valeur { font-family:'Sora',sans-serif; font-size:.95rem; color:#1a2a6c; font-weight:800; }
.carg-actions { display:flex; gap:6px; }

/* Douane indicator */
.douane-indicator {
  display:flex; align-items:center; gap:6px;
  padding:8px 12px; border-radius:var(--radius-xs);
  font-size:.78rem; font-weight:700;
}
.douane-ok   { background:#f0fff4; color:var(--brand); }
.douane-warn { background:#fff7ed; color:var(--accent); }
.douane-bad  { background:#fef2f2; color:#EF4444; }

/* Calculateur coût de revient */
.calc-row {
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 0; border-bottom:1px solid var(--border); font-size:.85rem;
}
.calc-row:last-child { border-bottom:none; }
.calc-row .label { color:var(--muted); }
.calc-row .val   { font-weight:700; }
.calc-total {
  background: linear-gradient(135deg,#1a2a6c,#b21f1f);
  color:#fff; border-radius:var(--radius-xs); padding:12px 16px;
  display:flex; justify-content:space-between; align-items:center;
  margin-top:12px; font-family:'Sora',sans-serif;
}
.calc-total .t-label { font-size:.8rem; opacity:.8; }
.calc-total .t-val   { font-size:1.1rem; font-weight:800; }

/* Réseau grossistes */
.grossiste-network-card {
  background:var(--surface); border-radius:var(--radius-sm);
  border:1.5px solid var(--border); padding:14px; margin-bottom:10px;
  display:flex; align-items:center; gap:12px; box-shadow:var(--shadow);
  animation: fadeUp .3s ease;
}
.grossiste-network-card .gn-info { flex:1; }
.grossiste-network-card .gn-nom  { font-weight:700; font-size:.9rem; }
.grossiste-network-card .gn-zone { font-size:.75rem; color:var(--muted); margin-top:2px; }
.stock-pill {
  padding:5px 10px; border-radius:50px; font-size:.72rem; font-weight:800;
}
.stock-pill.low  { background:#fef2f2; color:#EF4444; }
.stock-pill.med  { background:#fff7ed; color:var(--accent); }
.stock-pill.high { background:#f0fff4; color:var(--brand); }

/* Radar pénurie */
.penury-alert {
  display:flex; align-items:center; gap:10px;
  padding:12px 16px; border-radius:var(--radius-sm);
  margin-bottom:8px; animation: fadeUp .3s ease;
}
.penury-alert.critical { background:#fef2f2; border-left:4px solid #EF4444; }
.penury-alert.warning  { background:#fff7ed; border-left:4px solid var(--accent); }
.penury-alert .pa-icon { font-size:1.3rem; flex-shrink:0; }
.penury-alert .pa-info .pa-prod { font-weight:700; font-size:.88rem; }
.penury-alert .pa-info .pa-sub  { font-size:.75rem; color:var(--muted); margin-top:2px; }

/* Insight IA */
.ai-insight {
  background: #f0f7ff; border-left: 4px solid var(--info);
  padding: 12px 16px; border-radius:0 var(--radius-xs) var(--radius-xs) 0;
  font-style: italic; font-size: .85rem; color: var(--text);
  line-height: 1.6; margin-top:12px;
}
.ai-insight strong { color:var(--info); font-style:normal; }

/* ── OFFLINE QUEUE indicator ── */
.offline-q-badge {
  position:fixed; bottom:20px; right:20px; z-index:6000;
  background:var(--accent); color:#fff;
  padding:10px 16px; border-radius:50px; font-size:.82rem; font-weight:700;
  box-shadow:var(--shadow); display:none;
  animation:fadeUp .3s ease;
}

/* Boutons dans popup */

<script>
// ════════════════════════════════════════════════════
// 1. CONFIG SUPABASE
// NOTE SÉCURITÉ : La clé anon (publishable) est côté client par design Supabase.
// MAIS vous devez activer Row Level Security (RLS) sur toutes vos tables
// dans le dashboard Supabase pour protéger les données !
// ════════════════════════════════════════════════════
const SUPABASE_URL = 'https://plisyaquijijmwbbuegy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_nfKDb7KXudkpzLPa-nTMtQ_FRW6sQj_'; // clé anon publique OK
const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ════════════════════════════════════════════════════
// 2. SYSTÈME TOAST (remplace alert())
// ════════════════════════════════════════════════════
function toast(msg, type='', duration=3500) {
  const c = document.getElementById('hx-toast-container');
  const el = document.createElement('div');
  el.className = `hx-toast ${type}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'toastOut .3s ease forwards';
    setTimeout(() => el.remove(), 300);
  }, duration);
}

// ════════════════════════════════════════════════════
// 3. SYSTÈME DIALOG (remplace confirm() / prompt())
// ════════════════════════════════════════════════════
let _dialogResolve = null;

function hxDialog({ title, msg, confirm='Confirmer', cancel='Annuler', type='confirm', placeholder='' }) {
  return new Promise(resolve => {
    _dialogResolve = resolve;
    document.getElementById('hx-dialog-title').textContent = title;
    document.getElementById('hx-dialog-msg').textContent   = msg;
    document.getElementById('hx-dialog-confirm-btn').textContent = confirm;
    document.getElementById('hx-dialog-cancel-btn').textContent  = cancel;

    const inp = document.getElementById('hx-dialog-input');
    if(type === 'prompt') {
      inp.classList.remove('hidden');
      inp.value = '';
      inp.placeholder = placeholder;
      inp.focus();
    } else {
      inp.classList.add('hidden');
    }

    document.getElementById('hx-dialog-overlay').classList.remove('hidden');
  });
}
function hxDialogConfirm() {
  const inp = document.getElementById('hx-dialog-input');
  const val = inp.classList.contains('hidden') ? true : inp.value.trim();
  document.getElementById('hx-dialog-overlay').classList.add('hidden');
  if(_dialogResolve) { _dialogResolve(val); _dialogResolve = null; }
}
function hxDialogCancel() {
  document.getElementById('hx-dialog-overlay').classList.add('hidden');
  if(_dialogResolve) { _dialogResolve(false); _dialogResolve = null; }
}

// ════════════════════════════════════════════════════
// 4. SANITIZE (protection XSS)
// ════════════════════════════════════════════════════
function sanitize(str) {
  const d = document.createElement('div');
  d.appendChild(document.createTextNode(String(str)));
  return d.innerHTML;
}

// ════════════════════════════════════════════════════
// 5. OFFLINE QUEUE (hors-ligne)
// ════════════════════════════════════════════════════
const OFFLINE_QUEUE_KEY = 'hx_offline_queue';

function getOfflineQueue() {
  try { return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || '[]'); }
  catch { return []; }
}
function saveOfflineQueue(q) {
  localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q));
  updateOfflineBadge();
}
function addToOfflineQueue(action) {
  const q = getOfflineQueue();
  q.push({ ...action, ts: Date.now() });
  saveOfflineQueue(q);
}
function updateOfflineBadge() {
  const q = getOfflineQueue();
  const badge = document.getElementById('offline-q-badge');
  const count = document.getElementById('offline-q-count');
  if(q.length > 0) {
    badge.style.display = 'flex';
    count.textContent = q.length;
  } else {
    badge.style.display = 'none';
  }
}

async function syncOfflineQueue() {
  if(!navigator.onLine) return;
  const q = getOfflineQueue();
  if(q.length === 0) return;

  let synced = 0;
  const remaining = [];

  for(const item of q) {
    try {
      if(item.type === 'insert_mission') {
        const { error } = await _sb.from('missions').insert([item.data]);
        if(!error) { synced++; continue; }
      }
      remaining.push(item);
    } catch { remaining.push(item); }
  }

  saveOfflineQueue(remaining);
  if(synced > 0) toast(`✅ ${synced} vente(s) synchronisée(s)`, 'success');
}

// ════════════════════════════════════════════════════
// 6. SURVEILLANCE RÉSEAU
// ════════════════════════════════════════════════════
function initNetworkWatcher() {
  const banner = document.getElementById('offline-banner');
  const check = () => {
    if(navigator.onLine) {
      banner.classList.remove('show');
      syncOfflineQueue();
    } else {
      banner.classList.add('show');
    }
  };
  window.addEventListener('online',  check);
  window.addEventListener('offline', check);
  check();
}

// ════════════════════════════════════════════════════
// 7. GPS
// ════════════════════════════════════════════════════
let clientGPS = { lat: null, lon: null };
let watchId = null, missionWatchId = null;

function stopGPS() {
  if(watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if(missionWatchId !== null) { navigator.geolocation.clearWatch(missionWatchId); missionWatchId = null; }
}

function activerGPS(targetRole) {
  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      const acc = Math.round(pos.coords.accuracy);
      clientGPS.lat = pos.coords.latitude;
      clientGPS.lon = pos.coords.longitude;

      const box     = document.getElementById('gps-box');
      const txt     = document.getElementById('gps-text');
      const icon    = document.getElementById('gps-icon');
      const btnSave = document.getElementById(`btn-save-${targetRole}`);
      if(!box) return;

      if(acc <= 50) {
        box.className='gps-box ok';
        if(txt) txt.textContent = `✅ Position précise (${acc}m)`;
        if(icon) icon.textContent = '✅';
        if(btnSave) { btnSave.disabled=false; }
      } else {
        box.className='gps-box warn';
        if(txt) txt.textContent = `⚠️ Signal moyen (${acc}m) – Bougez vers une fenêtre`;
        if(icon) icon.textContent = '⚠️';
      }
    },
    () => toast('❌ GPS refusé. Autorisez la localisation.','error'),
    { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
  );
}

// ════════════════════════════════════════════════════
// 8. PROFILS UTILISATEUR
// ════════════════════════════════════════════════════
let userProfiles = { client:false, fournisseur:false, livreur:false };

async function verifierProfils(phone) {
  try {
    const [rc, rv, rl] = await Promise.all([
      _sb.from('clients').select('nom,zone').eq('telephone',phone).maybeSingle(),
      _sb.from('vendeurs').select('nom').eq('telephone',phone).maybeSingle(),
      _sb.from('livreurs').select('nom,zone').eq('telephone',phone).maybeSingle(),
    ]);
    userProfiles.client     = !!rc.data;
    userProfiles.fournisseur= !!rv.data;
    userProfiles.livreur    = !!rl.data;

    const nom  = rc.data?.nom  || rv.data?.nom  || rl.data?.nom;
    const zone = rc.data?.zone || rl.data?.zone;
    if(nom)  localStorage.setItem('hx_name', nom);
    if(zone) localStorage.setItem('hx_zone', zone);
  } catch(e) { console.error('verifierProfils:', e); }
}

// ════════════════════════════════════════════════════
// 9. INIT
// ════════════════════════════════════════════════════
window.addEventListener('load', async () => {
  initTheme();          // ← Appliquer le thème sauvegardé immédiatement
  initNetworkWatcher();
  updateOfflineBadge();
  syncOfflineQueue();

  // Masquer loading après 1.5s ou quand tout est prêt
  setTimeout(() => {
    const ls = document.getElementById('loading-screen');
    ls.style.opacity = '0';
    setTimeout(() => ls.remove(), 500);
  }, 1400);

  const phone = sess('hx_phone');
  const role  = sess('hx_role');

  if(phone) {
    await verifierProfils(phone);
    if(role === 'client')       afficherClient();
    else if(role === 'fournisseur') afficherFournisseur();
    else if(role === 'livreur') afficherLivreur();
    else dirigerPremierProfil();
  } else {
    afficherAccueil();
  }
  updateMenu();
});

// Session helpers
function sess(k, v) {
  if(v !== undefined) { localStorage.setItem(k, v); return v; }
  return localStorage.getItem(k) || '';
}

function dirigerPremierProfil() {
  if(userProfiles.client)      { sess('hx_role','client');      afficherClient(); }
  else if(userProfiles.fournisseur){ sess('hx_role','fournisseur'); afficherFournisseur(); }
  else if(userProfiles.livreur){ sess('hx_role','livreur');     afficherLivreur(); }
  else afficherAccueil();
}

// ════════════════════════════════════════════════════
// 10. SIDENAV
// ════════════════════════════════════════════════════
function openNav() {
  document.getElementById('sidenav').classList.add('open');
  document.getElementById('sidenav-overlay').classList.add('open');
}
function closeNav() {
  document.getElementById('sidenav').classList.remove('open');
  document.getElementById('sidenav-overlay').classList.remove('open');
}

function updateMenu() {
  const phone = sess('hx_phone');
  const role  = sess('hx_role');
  const name  = sess('hx_name') || 'Utilisateur';

  const avatar = document.getElementById('nav-avatar');
  const navName = document.getElementById('nav-name');
  const navRole = document.getElementById('nav-role');
  const body   = document.getElementById('sidenav-body');

  if(avatar) avatar.textContent = name.charAt(0).toUpperCase() || '?';
  if(navName) navName.textContent = sanitize(name);
  if(navRole) navRole.textContent = phone ? role.toUpperCase() : 'Visiteur';

  if(!body) return;

  // ── Sélecteur de thème (toujours visible) ──
  const currentTheme = localStorage.getItem('hx_theme') || 'emerald';
  let html = `
    <div class="sidenav-section-label">Apparence</div>
    <div class="theme-switcher">
      <button class="theme-btn ${currentTheme==='emerald'?'active':''}" data-t="emerald" onclick="basculerTheme('emerald')">
        <span class="tb-icon">🌿</span>
        <span>Émeraude</span>
        <div class="tb-dot"></div>
      </button>
      <button class="theme-btn ${currentTheme==='night-gold'?'active':''}" data-t="night-gold" onclick="basculerTheme('night-gold')">
        <span class="tb-icon">🌙</span>
        <span>Nuit Dorée</span>
        <div class="tb-dot"></div>
      </button>
    </div>
  `;

  if(!phone) {
    html += `
      <div class="sidenav-section-label">Navigation</div>
      <div class="sidenav-item" onclick="afficherAccueil();closeNav()"><span class="sidenav-item-icon">🏠</span> Accueil</div>
    `;
  } else {
    // Basculer profils
    const switch_items = [];
    if(userProfiles.client && role!=='client')
      switch_items.push({r:'client',t:'Mode Acheteur',icon:'🛒'});
    // Les rôles commerçants ont leur propre accès via le portail fournisseur
    if(userProfiles.livreur && role!=='livreur')
      switch_items.push({r:'livreur',t:'Espace Livreur',icon:'🏍️'});

    if(switch_items.length > 0) {
      html += `<div class="sidenav-section-label">Mes espaces</div>`;
      switch_items.forEach(i => {
        html += `<div class="sidenav-item" onclick="changerRole('${i.r}')"><span class="sidenav-item-icon">${i.icon}</span> ${sanitize(i.t)}</div>`;
      });
    }

    // Créer nouveaux profils
    const create_items = [];
    if(!userProfiles.client)      create_items.push({r:'client',t:'Devenir Acheteur',icon:'✨'});
    // Accès commerçant via le portail dédié
    if(!userProfiles.livreur)     create_items.push({r:'livreur',t:'Devenir Livreur',icon:'✨'});

    if(create_items.length > 0) {
      html += `<div class="sidenav-section-label">Opportunités</div>`;
      create_items.forEach(i => {
        html += `<div class="sidenav-item highlight" onclick="selectRole('${i.r}');closeNav()"><span class="sidenav-item-icon">${i.icon}</span> ${sanitize(i.t)}</div>`;
      });
    }

    html += `
      <div class="sidenav-section-label">Compte</div>
      <div class="sidenav-item" onclick="editZone()"><span class="sidenav-item-icon">📍</span> Modifier ma zone</div>
      <div class="sidenav-item danger" onclick="deconnexion()"><span class="sidenav-item-icon">🚪</span> Se déconnecter</div>
    `;
  }

  body.innerHTML = html;
}

// SYSTÈME DE THÈMES
// ════════════════════════════════════════════════════
function basculerTheme(theme) {
  const root = document.documentElement;

  // Appliquer / retirer l'attribut data-theme
  if(theme === 'emerald') {
    root.removeAttribute('data-theme');
  } else {
    root.setAttribute('data-theme', theme);
  }

  // Persister le choix
  localStorage.setItem('hx_theme', theme);

  // Mettre à jour les boutons du menu sans refermer le nav
  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.t === theme);
  });

  // Toast de confirmation discret
  const labels = { emerald:'🌿 Thème Émeraude', 'night-gold':'🌙 Thème Nuit Dorée' };
  toast(labels[theme] || 'Thème appliqué', 'success');
}

function initTheme() {
  const saved = localStorage.getItem('hx_theme') || 'emerald';
  if(saved !== 'emerald') {
    document.documentElement.setAttribute('data-theme', saved);
  }
}

function changerRole(role) {
  sess('hx_role', role);
  closeNav();
  if(role==='client')          afficherClient();
  else if(role==='boutiquier') afficherStock('Boutiquier');
  else if(role==='grossiste')  afficherInterfaceGrossiste();
  else if(role==='importateur') afficherInterfaceImportateur();
  else if(role==='livreur')    afficherLivreur();
  updateMenu();
}

async function deconnexion() {
  const ok = await hxDialog({ title:'Déconnexion', msg:'Voulez-vous vraiment vous déconnecter ?', confirm:'Déconnecter' });
  if(!ok) return;
  stopGPS();
  localStorage.clear();
  userProfiles = { client:false, fournisseur:false, livreur:false };
  clientGPS = { lat:null, lon:null };
  closeNav();
  afficherAccueil();
  updateMenu();
}

async function editZone() {
  closeNav();
  const zones = ['Kaloum','Dixinn','Ratoma','Matam','Matoto'];
  const val = await hxDialog({
    title:'Votre commune',
    msg:'Entrez votre commune : Kaloum, Dixinn, Ratoma, Matam ou Matoto',
    type:'prompt',
    placeholder:'Ex: Ratoma'
  });
  if(!val) return;
  const zone = zones.find(z => z.toLowerCase() === val.toLowerCase());
  if(!zone) { toast('Zone non reconnue','error'); return; }

  const phone = sess('hx_phone');
  const role  = sess('hx_role');
  if(phone) {
    const table = role==='client'?'clients':role==='livreur'?'livreurs':null;
    if(table) {
      const { error } = await _sb.from(table).update({zone}).eq('telephone',phone);
      if(error) { toast('Erreur mise à jour serveur','error'); return; }
    }
  }
  sess('hx_zone', zone);
  toast(`✅ Zone mise à jour : ${zone}`, 'success');
  if(role==='client')      afficherClient();
  else if(role==='livreur') afficherLivreur();
  else toast('Zone mise à jour', 'success');
}

async function selectRole(role) {
  // Fournisseur → accès direct au portail de choix, sans connexion
  if(role === 'fournisseur') {
    afficherPortailFournisseur();
    return;
  }

  const phone = sess('hx_phone');

  if(!phone) {
    const ok = await hxDialog({
      title:'Vous avez déjà un compte ?',
      msg:'Appuyez sur "Connexion" si vous avez déjà un compte, sinon "Inscription".',
      confirm:'Connexion', cancel:'Inscription'
    });
    if(ok) afficherConnexion(role);
    else   afficherInscription(role);
    return;
  }

  // Client et livreur uniquement
  const table = role==='client'?'clients':'livreurs';
  const { data } = await _sb.from(table).select('telephone').eq('telephone',phone).maybeSingle();
  if(data) {
    sess('hx_role',role);
    if(role==='client') afficherClient();
    else                afficherLivreur();
    updateMenu();
  } else {
    afficherInscription(role);
  }
}

async function connexion(role) {
  const tel = document.getElementById('login-tel')?.value?.trim();
  if(!tel) { toast('Entrez votre numéro','warn'); return; }

  const tableMap = { client:'clients', boutiquier:'vendeurs', grossiste:'grossistes', importateur:'importateurs', livreur:'livreurs' };
  const table = tableMap[role] || 'clients';
  const { data, error } = await _sb.from(table).select('*').eq('telephone',tel).maybeSingle();

  if(error || !data) { toast('Aucun compte trouvé. Inscrivez-vous !','error'); return; }

  sess('hx_phone', data.telephone);
  sess('hx_role',  role);
  sess('hx_name',  data.nom || '');
  if(data.zone) sess('hx_zone', data.zone);
  if(data.latitude)  localStorage.setItem('hx_lat', data.latitude);
  if(data.longitude) localStorage.setItem('hx_lon', data.longitude);

  await verifierProfils(data.telephone);
  toast(`Bienvenue ${data.nom} !`, 'success');
  if(role==='client')          afficherClient();
  else if(role==='boutiquier') afficherStock('Boutiquier');
  else if(role==='grossiste')  afficherInterfaceGrossiste();
  else if(role==='importateur') afficherInterfaceImportateur();
  else                         afficherLivreur();
  updateMenu();
}

async function inscription(role) {
  const nom = document.getElementById('reg-nom')?.value?.trim();
  const tel = document.getElementById('reg-tel')?.value?.trim();

  if(!nom || !tel) { toast('Remplissez tous les champs','warn'); return; }
  if(tel.length < 9) { toast('Numéro invalide','error'); return; }

  const obj = { nom, telephone: tel };

  if(role === 'client') {
    if(!clientGPS.lat) { toast('GPS requis pour votre position','warn'); return; }
    obj.zone = document.getElementById('reg-zone')?.value;
    obj.latitude  = clientGPS.lat;
    obj.longitude = clientGPS.lon;
  } else if(role === 'fournisseur') {
    if(!clientGPS.lat) { toast('GPS requis pour la boutique','warn'); return; }
    obj.nom_boutique = document.getElementById('reg-shop')?.value?.trim();
    obj.latitude  = clientGPS.lat;
    obj.longitude = clientGPS.lon;
  } else if(role === 'livreur') {
    if(!clientGPS.lat) { toast('GPS requis pour votre position de départ','warn'); return; }
    obj.zone = document.getElementById('reg-zone')?.value;
    obj.latitude  = clientGPS.lat;
    obj.longitude = clientGPS.lon;
  }

  const btn = document.getElementById(`btn-save-${role}`);
  if(btn) { btn.disabled=true; btn.textContent='⏳ Création...'; }

  const table = role==='client'?'clients':role==='fournisseur'?'vendeurs':'livreurs';

  // Vérifier doublon
  const { data:existing } = await _sb.from(table).select('telephone').eq('telephone',tel).maybeSingle();
  if(existing) {
    toast('Compte existant – connexion automatique','warn');
    sess('hx_phone',tel); sess('hx_role',role); sess('hx_name',nom);
    await verifierProfils(tel);
    changerRole(role); return;
  }

  const { error } = await _sb.from(table).insert([obj]);
  if(error) { toast('Erreur: '+error.message,'error'); if(btn){btn.disabled=false;btn.textContent='Créer mon compte';} return; }

  stopGPS();
  sess('hx_phone',tel); sess('hx_role',role); sess('hx_name',nom);
  if(obj.zone) sess('hx_zone',obj.zone);
  if(obj.latitude)  { localStorage.setItem('hx_lat', obj.latitude); }
  if(obj.longitude) { localStorage.setItem('hx_lon', obj.longitude); }

  await verifierProfils(tel);
  toast(`Bienvenue ${nom} !`, 'success');
  changerRole(role);
}

async function chargerProduits(zone) {
  const grid = document.getElementById('product-grid');
  if(!grid) return;

  // Charger depuis cache si offline
  if(!navigator.onLine) {
    const cached = JSON.parse(localStorage.getItem('hx_produits_cache') || '[]');
    if(cached.length > 0) { _produits = cached; afficherProduits(zone); return; }
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">📡</div><div class="empty-title">Hors ligne</div><div class="empty-sub">Aucun produit en cache.</div></div>`;
    return;
  }

  const { data, error } = await _sb.from('produits').select('*').order('created_at',{ascending:false});

  if(error || !data || data.length===0) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-title">Aucun produit</div><div class="empty-sub">Les commerçants ajoutent bientôt leurs articles.</div></div>`;
    return;
  }

  _produits = data;
  localStorage.setItem('hx_produits_cache', JSON.stringify(data)); // cache offline
  afficherProduits(zone);
}

function afficherProduits(zone, query='') {
  const grid = document.getElementById('product-grid');
  if(!grid) return;

  let liste = _produits;
  if(query) liste = liste.filter(p => p.nom_produit?.toLowerCase().includes(query.toLowerCase()));

  // Trier : zone proche en premier
  liste = [...liste].sort((a,b)=>{
    if(a.zone===zone && b.zone!==zone) return -1;
    if(a.zone!==zone && b.zone===zone) return  1;
    return 0;
  });

  if(liste.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">Aucun résultat</div><div class="empty-sub">Essayez un autre terme.</div></div>`;
    return;
  }

  grid.innerHTML = liste.map((p,i) => `
    <div class="product-card" style="animation-delay:${i*.04}s">
      <div class="pc-img">
        📦
        ${p.zone===zone ? '<span class="pc-badge-local">Proche</span>' : ''}
      </div>
      <div class="pc-body">
        <div class="pc-name">${sanitize(p.nom_produit)}</div>
        <div class="pc-zone">📍 ${sanitize(p.zone||'')}</div>
        <div class="pc-price">${Number(p.prix).toLocaleString('fr-FR')} GNF</div>
      </div>
      <button class="pc-cta" onclick="commander('${sanitize(p.id)}','${sanitize(p.vendeur_contact||'')}',${p.prix})">Commander</button>
    </div>`).join('');
}

function filtrerProduits() {
  const q = document.getElementById('search-input')?.value || '';
  afficherProduits(sess('hx_zone'), q);
}

// ── Commander ──
async function commander(produitId, vendeurTel, prix) {
  const clientLat = parseFloat(localStorage.getItem('hx_lat'));
  const clientLon = parseFloat(localStorage.getItem('hx_lon'));

  let frais = 15000; // frais par défaut si pas de GPS

  if(clientLat && vendeurTel) {
    try {
      const { data:v } = await _sb.from('vendeurs').select('latitude,longitude').eq('telephone',vendeurTel).single();
      if(v?.latitude) {
        const dist = calculerDistance(v.latitude, v.longitude, clientLat, clientLon);
        frais = Math.round(5000 + dist * 2000);
      }
    } catch{}
  }

  ouvrirPaiementModal(frais, produitId, vendeurTel);
}

function calculerDistance(lat1,lon1,lat2,lon2) {
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function payerOM(frais, vendeurTel) {

  });

async function enregistrerMission(vendeurTel, frais, mode) {
  const monTel = sess('hx_phone');
  const zone   = sess('hx_zone');

  const payload = {
    vendeur_id: vendeurTel,
    client_id:  monTel,
    livreur_id: null,
    frais_livraison: frais,
    statut: 'en_attente',
    mode_paiement: mode,
    client_zone: zone,
    created_at: new Date().toISOString()
  };

  if(!navigator.onLine) {
    addToOfflineQueue({ type:'insert_mission', data:payload });
    toast('💾 Commande sauvegardée hors-ligne','warn');
    return;
  }

  const { error } = await _sb.from('missions').insert([payload]);
  if(error) { toast('Erreur: '+error.message,'error'); return; }
  toast('✅ Commande créée ! Un livreur sera affecté bientôt.','success');
}

async function inscriptionCommerçant(role) {
  const nom = document.getElementById('reg-nom')?.value?.trim();
  const tel = document.getElementById('reg-tel')?.value?.trim();

  if(!nom || !tel) { toast('Remplissez tous les champs','warn'); return; }
  if(tel.length < 9) { toast('Numéro invalide','error'); return; }
  if(!clientGPS.lat) { toast('GPS requis','warn'); return; }

  const obj = { nom, telephone: tel, latitude: clientGPS.lat, longitude: clientGPS.lon };

  if(role === 'boutiquier') {
    obj.nom_boutique = document.getElementById('reg-shop')?.value?.trim();
  } else if(role === 'grossiste') {
    obj.nom_entreprise = document.getElementById('reg-shop')?.value?.trim();
    obj.zone = document.getElementById('reg-zone')?.value;
  } else if(role === 'importateur') {
    obj.nom_societe = document.getElementById('reg-shop')?.value?.trim();
    obj.pays_origine = document.getElementById('reg-pays')?.value?.trim();
  }

  const btn = document.getElementById(`btn-save-${role}`);
  if(btn) { btn.disabled=true; btn.textContent='⏳ Création...'; }

  // Boutiquier → table vendeurs (existante), Grossiste/Importateur → nouvelles tables
  const tableMap = { boutiquier:'vendeurs', grossiste:'grossistes', importateur:'importateurs' };
  const table = tableMap[role];

  const { data:existing } = await _sb.from(table).select('telephone').eq('telephone',tel).maybeSingle();
  if(existing) {
    toast('Compte existant – connexion automatique','warn');
    sess('hx_phone',tel); sess('hx_role',role); sess('hx_name',nom);
    await verifierProfils(tel);
    if(role==='boutiquier')   afficherStock('Boutiquier');
    else if(role==='grossiste')  afficherInterfaceGrossiste();
    else                        afficherInterfaceImportateur();
    return;
  }

  const { error } = await _sb.from(table).insert([obj]);
  if(error) { toast('Erreur: '+error.message,'error'); if(btn){btn.disabled=false;btn.textContent='Créer mon compte';} return; }

  stopGPS();
  sess('hx_phone',tel); sess('hx_role',role); sess('hx_name',nom);
  if(obj.zone) sess('hx_zone',obj.zone);
  localStorage.setItem('hx_lat', obj.latitude);
  localStorage.setItem('hx_lon', obj.longitude);

  await verifierProfils(tel);
  toast(`Bienvenue ${nom} !`, 'success');
  if(role==='boutiquier')   afficherStock('Boutiquier');
  else if(role==='grossiste')  afficherInterfaceGrossiste();
  else                        afficherInterfaceImportateur();
  updateMenu();
}

async function actualiserDashboardGrossiste() {
  const tel = sess('hx_phone');

  // Valeur totale du stock
  const { data: lots } = await _sb.from('lots_grossistes').select('prix_unitaire,quantite').eq('grossiste_contact', tel);
  const valeurStock = (lots||[]).reduce((s,l) => s + (l.prix_unitaire||0)*(l.quantite||0), 0);

  // Commandes B2B en attente
  const { count: nbB2B } = await _sb.from('ventes_gros')
    .select('id',{count:'exact',head:true}).eq('grossiste_id',tel).eq('statut','en_attente');

  // Crédits actifs
  const { count: nbCredits } = await _sb.from('credits_boutiquiers')
    .select('id',{count:'exact',head:true}).eq('grossiste_id',tel).eq('rembourse',false);

  const el1 = document.getElementById('kpi-valeur-gros');
  const el2 = document.getElementById('kpi-commandes-boutiques');
  const el3 = document.getElementById('kpi-credits-actifs');
  if(el1) el1.textContent = Number(valeurStock).toLocaleString('fr-FR')+' GNF';
  if(el2) el2.textContent = nbB2B || 0;
  if(el3) el3.textContent = nbCredits || 0;

function calcArrivageTotal() {

  const upc = parseInt(document.getElementById('arr-unite-par-carton')?.value) || 0;
  const el  = document.getElementById('arr-total-calc');
  if(el) el.textContent = (nb * upc).toLocaleString('fr-FR') + ' unités';

async function enregistrerArrivage() {
  const nom      = document.getElementById('arr-nom')?.value?.trim();
  const unite    = document.getElementById('arr-unite')?.value;
  const nbC      = parseInt(document.getElementById('arr-nb-cartons')?.value);
  const upc      = parseInt(document.getElementById('arr-unite-par-carton')?.value);
  const prixAch  = parseInt(document.getElementById('arr-prix-achat')?.value) || 0;
  const prixVte  = parseInt(document.getElementById('arr-prix-vente')?.value);
  const cat      = document.getElementById('arr-cat')?.value;
  const zone     = document.getElementById('arr-zone')?.value;
  const tel      = sess('hx_phone');

  if(!nom || isNaN(nbC)||nbC<1 || isNaN(upc)||upc<1 || isNaN(prixVte)||prixVte<100) {
    toast('Remplissez tous les champs obligatoires','warn'); return;
  }
  const quantiteTotale = nbC * upc;
  const btn = document.getElementById('arr-btn');
  if(btn) { btn.disabled=true; btn.textContent='⏳ Enregistrement...'; }

  // Vérifier si le produit existe déjà pour ce grossiste
  const { data: existant } = await _sb.from('lots_grossistes')
    .select('id,quantite').eq('grossiste_contact',tel)
    .ilike('designation', nom).maybeSingle();

  let error;
  if(existant) {
    // Incrémenter le stock existant
    const res = await _sb.from('lots_grossistes')
      .update({ quantite: existant.quantite + quantiteTotale, prix_unitaire: prixVte, prix_achat: prixAch, updated_at: new Date().toISOString() })
      .eq('id', existant.id);
    error = res.error;
    if(!error) toast(`✅ Stock mis à jour : +${quantiteTotale} ${unite}(s)`, 'success');
  } else {
    // Créer une nouvelle ligne
    const res = await _sb.from('lots_grossistes').insert([{
      designation: nom, unite, quantite: quantiteTotale,
      nb_cartons: nbC, unite_par_carton: upc,
      prix_achat: prixAch, prix_unitaire: prixVte,
      categorie: cat, zone, grossiste_contact: tel,
      seuil_alerte: Math.max(5, Math.floor(quantiteTotale * 0.1)),
      created_at: new Date().toISOString()
    }]);
    error = res.error;
    if(!error) toast(`✅ Arrivage enregistré : ${quantiteTotale} ${unite}(s) de ${nom}`, 'success');
  }

  if(error) { toast('Erreur: '+error.message,'error'); }
  else {
    // Réinitialiser le formulaire
    ['arr-nom','arr-nb-cartons','arr-unite-par-carton','arr-prix-achat','arr-prix-vente'].forEach(id => {
      const el = document.getElementById(id); if(el) el.value='';
    });
    document.getElementById('arr-total-calc').textContent = '–';
    fermerModal('modal-arrivage');
    await chargerStockGros();
    await actualiserDashboardGrossiste();
  }
  if(btn) { btn.disabled=false; btn.textContent='✅ Enregistrer l\'arrivage'; }
}

let panierB2B = [];

function ouvrirVenteGros() {
  const modal = document.getElementById('modal-vente-gros');
  if(modal) { modal.classList.remove('hidden'); document.body.style.overflow='hidden'; }
