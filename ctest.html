<!DOCTYPE html>
<html>
<head>
    <title>HailandX - Test 3D Ultra</title>
    <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        body { margin: 0; padding: 0; background: #000; }
        #container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="container"></div>

    <script>
        const { DeckGL, ScenegraphLayer, AmbientLight, DirectionalLight, LightingEffect } = deck;

        // Configuration des lumières pour que la 3D soit visible
        const ambientLight = new AmbientLight({
            color: [255, 255, 255],
            intensity: 2.0
        });

        const directionalLight = new DirectionalLight({
            color: [255, 255, 255],
            intensity: 3.0,
            direction: [-1, -2, -3]
        });

        const lightingEffect = new LightingEffect({ambientLight, directionalLight});

        // Données basées sur tes liens réels
        const DATA = [
            {
                name: 'Building M',
                url: 'https://plisyaquijijmwbbuegy.supabase.co/storage/v1/object/public/hailand-assets/hailand-assets-kenny_city_industrial/building-m.glb',
                coords: [-13.6700, 9.5370],
                scale: 50 // Augmenté pour être sûr de le voir
            },
            {
                name: 'Skyscraper',
                url: 'https://plisyaquijijmwbbuegy.supabase.co/storage/v1/object/public/hailand-assets/building-skyscraper-a.glb',
                coords: [-13.6715, 9.5385],
                scale: 40
            }
        ];

        new DeckGL({
            container: 'container',
            initialViewState: {
                longitude: -13.6705,
                latitude: 9.5375,
                zoom: 16,
                pitch: 50,
                bearing: 0
            },
            controller: true,
            effects: [lightingEffect],
            layers: [
                new ScenegraphLayer({
                    id: 'models-3d',
                    data: DATA,
                    scenegraph: d => d.url,
                    getPosition: d => d.coords,
                    getOrientation: [0, 0, 0],
                    getScale: d => [d.scale, d.scale, d.scale],
                    sizeScale: 1,
                    pickable: true,
                    _lighting: 'pbr' // Rendu réaliste
                })
            ],
            // Ajout d'un fond de carte gratuit pour voir le sol
            getTooltip: ({object}) => object && `${object.name}`,
            mapStyle: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json'
        });
    </script>
</body>
</html>
